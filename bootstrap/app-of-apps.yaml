apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shahrah-root
  namespace: argocd
  labels:
    app.kubernetes.io/name: shahrah
    app.kubernetes.io/part-of: shahrah
spec:
  project: default
  source:
    repoURL: https://github.com/Delpak/shahrah-gitops.git
    targetRevision: main
    path: apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

