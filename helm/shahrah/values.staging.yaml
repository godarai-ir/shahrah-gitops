global:
  imageRegistry: registry.distr.sh/godar
  imageTag: "sha-8f95aa99ca2cf35b41be8bc5d6f2ab06c11d1e91"

imagePullSecrets:
  - regcred

config:
  create: true
  name: shahrah-config
  data:
    SHAHRAH_MODEL_DISCOVERY_URL: http://model-discovery:3002/api/v1
    MODEL_DISCOVERY_CORS_ORIGIN: https://tenant-admin.staging.shahrah.ir,https://support-admin.staging.shahrah.ir
    NEXT_PUBLIC_MODEL_CATALOG_API_BASE: https://support-admin.staging.shahrah.ir/api/v1
    MODEL_CATALOG_API_BASE_INTERNAL: http://model-discovery:3002/api/v1
    REDIS_HOST: redis.staging.internal
    REDIS_PORT: "6379"
    CLICKHOUSE_DB: sharah_db
    CLICKHOUSE_USER: sharah_user
    CLICKHOUSE_HTTP_PORT: "8123"
    CLICKHOUSE_NATIVE_PORT: "9000"
    TYPESENSE_HOST: typesense.staging.internal
    TYPESENSE_PORT: "8108"
    TYPESENSE_PROTOCOL: https
    TUNNEL_SERVER_URL: http://tunnel-server:8082
    TUNNEL_CLIENT_URL: http://tunnel-client:8081
    SILK_ROAD_URL: http://silk-road:8083
    SMTP_HOST: smtp.staging.internal
    SMTP_PORT: "587"
    SMTP_FROM: no-reply@staging.shahrah.ir
    EMAIL_SENDING_ENABLED: "true"

secrets:
  create: false
  name: shahrah-secret
  data: {}

controlPlane:
  ingress:
    hosts:
      - host: api.staging.shahrah.ir
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      secretName: api-staging-shahrah-ir-tls
      clusterIssuer: letsencrypt-prod

tenantAdmin:
  ingress:
    hosts:
      - host: "*.localhost"
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      secretName: localhost-tenant-admin-tls
      clusterIssuer: ""

website:
  ingress:
    hosts:
      - host: localhost
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      secretName: localhost-website-tls
      clusterIssuer: ""

blog:
  ingress:
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2
    hosts:
      - host: localhost
        paths:
          - path: /blog(/|$)(.*)
            pathType: ImplementationSpecific
    tls:
      enabled: true
      secretName: localhost-blog-tls
      clusterIssuer: ""

docs:
  ingress:
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2
    hosts:
      - host: localhost
        paths:
          - path: /docs(/|$)(.*)
            pathType: ImplementationSpecific
    tls:
      enabled: true
      secretName: localhost-docs-tls
      clusterIssuer: ""

modelDiscovery:
  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2
    hosts:
      - host: localhost
        paths:
          - path: /models(/|$)(.*)
            pathType: ImplementationSpecific
    tls:
      enabled: true
      secretName: localhost-model-discovery-tls
      clusterIssuer: ""

migrations:
  enabled: false
