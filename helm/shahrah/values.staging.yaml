global:
  imageRegistry: registry.distr.sh/godar
  imageTag: sha-45b16b9e74959a6bdd7866fe4f23dd8376ad4842
imagePullSecrets:
- regcred
config:
  create: true
  name: shahrah-config
  data:
    SHAHRAH_MODEL_DISCOVERY_URL: http://model-discovery:3002/api/v1
    SHAHRAH_CONTROL_PLANE_URL: http://control-plane:4000
    MODEL_DISCOVERY_CORS_ORIGIN: https://tenant-admin.staging.shahrah.ir,https://support-admin.staging.shahrah.ir,https://localhost:7000
    NEXT_PUBLIC_MODEL_CATALOG_API_BASE: https://localhost:7000/catalog/api/v1
    MODEL_CATALOG_API_BASE_INTERNAL: http://model-discovery:3002/api/v1
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    CLICKHOUSE_DB: sharah_db
    CLICKHOUSE_USER: sharah_user
    CLICKHOUSE_HTTP_PORT: '8123'
    CLICKHOUSE_NATIVE_PORT: '9000'
    TYPESENSE_HOST: typesense.staging.internal
    TYPESENSE_PORT: '8108'
    TYPESENSE_PROTOCOL: https
    TUNNEL_SERVER_URL: http://tunnel-server:8082
    TUNNEL_CLIENT_URL: http://tunnel-client:8081
    SILK_ROAD_URL: http://silk-road:8083
    SMTP_HOST: mailpit
    SMTP_PORT: '1025'
    SMTP_FROM: no-reply@staging.shahrah.ir
    EMAIL_SENDING_ENABLED: 'true'
secrets:
  create: false
  name: shahrah-secret
  data: {}
controlPlane:
  image:
    tag: sha-ace4b02d9103c2459fa655dfbdee418db40b1eb3
  ingress:
    hosts:
    - host: api.staging.shahrah.ir
      paths:
      - path: /
        pathType: Prefix
    tls:
      enabled: true
      secretName: api-staging-shahrah-ir-tls
      clusterIssuer: letsencrypt-prod
tenantAdmin:
  image:
    tag: sha-632a4ddc89733e1de0c8970b93d5a21d2c587992
  envFromConfigKeys:
  - SHAHRAH_CONTROL_PLANE_URL
  - SHAHRAH_MODEL_DISCOVERY_URL
  envFromSecretKeys:
  - MASTER_KEY
  ingress:
    hosts:
    - host: '*.localhost'
      paths:
      - path: /
        pathType: Prefix
    tls:
      enabled: true
      secretName: localhost-tenant-admin-tls
      clusterIssuer: ''
website:
  image:
    tag: sha-300355c0ace65dee15f1629af394dfc8d9348665
  ingress:
    hosts:
    - host: localhost
      paths:
      - path: /
        pathType: Prefix
    tls:
      enabled: true
      secretName: localhost-website-tls
      clusterIssuer: ''
blog:
  image:
    tag: sha-300355c0ace65dee15f1629af394dfc8d9348665
  ingress:
    annotations:
      nginx.ingress.kubernetes.io/use-regex: 'true'
      nginx.ingress.kubernetes.io/rewrite-target: /$2
    hosts:
    - host: localhost
      paths:
      - path: /blog(/|$)(.*)
        pathType: ImplementationSpecific
    tls:
      enabled: true
      secretName: localhost-blog-tls
      clusterIssuer: ''
docs:
  image:
    tag: sha-300355c0ace65dee15f1629af394dfc8d9348665
  ingress:
    hosts:
    - host: localhost
      paths:
      - path: /docs
        pathType: Prefix
    tls:
      enabled: true
      secretName: localhost-docs-tls
      clusterIssuer: ''
supportAdmin:
  image:
    tag: sha-402c4236ff6396f316856c642b63d91ea153bc91
  probes:
    readiness:
      path: /catalog
    liveness:
      path: /catalog
  ingress:
    enabled: true
    annotations:
      argocd.argoproj.io/sync-wave: '1'
    hosts:
    - host: localhost
      paths:
      - path: /catalog
        pathType: Prefix
    tls:
      enabled: true
      secretName: localhost-support-admin-tls
      clusterIssuer: ''
modelDiscovery:
  image:
    tag: sha-300355c0ace65dee15f1629af394dfc8d9348665
  extraEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: shahrah-secret
        key: MODEL_DISCOVERY_DATABASE_URL
  ingress:
    enabled: true
    annotations:
      argocd.argoproj.io/sync-wave: '-1'
      nginx.ingress.kubernetes.io/use-regex: 'true'
      nginx.ingress.kubernetes.io/rewrite-target: /api/v1/$2
    hosts:
    - host: localhost
      paths:
      - path: /catalog/api/v1(/|$)(.*)
        pathType: ImplementationSpecific
    tls:
      enabled: true
      secretName: localhost-model-discovery-tls
      clusterIssuer: ''
migrations:
  enabled: true
  mainDb:
    enabled: false
    image:
      tag: ''
  modelDiscovery:
    enabled: true
    image:
      tag: ''
silkRoad:
  image:
    tag: sha-300355c0ace65dee15f1629af394dfc8d9348665
tunnelServer:
  image:
    tag: sha-300355c0ace65dee15f1629af394dfc8d9348665
tunnelClient:
  image:
    tag: sha-300355c0ace65dee15f1629af394dfc8d9348665
externalServices:
  postgres:
    enabled: true
    name: postgres
    externalName: host.docker.internal
    port: 5432
  redis:
    enabled: true
    name: redis
    externalName: host.docker.internal
    port: 6379
mailpit:
  enabled: true
  webroot: /mailpit
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
    - host: localhost
      paths:
      - path: /mailpit
        pathType: Prefix
    tls:
      enabled: true
      secretName: localhost-mailpit-tls
      clusterIssuer: ''
