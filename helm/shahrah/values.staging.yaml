global:
  imageRegistry: registry.distr.sh/godar
  imageTag: "sha-804c0eb7ad7de89e978feadc777124d7f2b76bcf"

imagePullSecrets:
  - regcred

config:
  create: true
  name: shahrah-config
  data:
    SHAHRAH_MODEL_DISCOVERY_URL: http://model-discovery:3002/api/v1
    SHAHRAH_CONTROL_PLANE_URL: http://control-plane:4000
    MODEL_DISCOVERY_CORS_ORIGIN: https://tenant-admin.staging.shahrah.ir,https://support-admin.staging.shahrah.ir,https://localhost:7000
    NEXT_PUBLIC_MODEL_CATALOG_API_BASE: https://localhost:7000/api/v1
    MODEL_CATALOG_API_BASE_INTERNAL: http://model-discovery:3002/api/v1
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    CLICKHOUSE_DB: sharah_db
    CLICKHOUSE_USER: sharah_user
    CLICKHOUSE_HTTP_PORT: "8123"
    CLICKHOUSE_NATIVE_PORT: "9000"
    TYPESENSE_HOST: typesense.staging.internal
    TYPESENSE_PORT: "8108"
    TYPESENSE_PROTOCOL: https
    TUNNEL_SERVER_URL: http://tunnel-server:8082
    TUNNEL_CLIENT_URL: http://tunnel-client:8081
    SILK_ROAD_URL: http://silk-road:8083
    SMTP_HOST: smtp.staging.internal
    SMTP_PORT: "587"
    SMTP_FROM: no-reply@staging.shahrah.ir
    EMAIL_SENDING_ENABLED: "true"

secrets:
  create: false
  name: shahrah-secret
  data: {}

controlPlane:
  ingress:
    hosts:
      - host: api.staging.shahrah.ir
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      secretName: api-staging-shahrah-ir-tls
      clusterIssuer: letsencrypt-prod

tenantAdmin:
  envFromConfigKeys:
    - SHAHRAH_CONTROL_PLANE_URL
    - SHAHRAH_MODEL_DISCOVERY_URL
  envFromSecretKeys:
    - MASTER_KEY
  ingress:
    hosts:
      - host: "*.localhost"
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      secretName: localhost-tenant-admin-tls
      clusterIssuer: ""

website:
  ingress:
    hosts:
      - host: localhost
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      secretName: localhost-website-tls
      clusterIssuer: ""

blog:
  ingress:
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2
    hosts:
      - host: localhost
        paths:
          - path: /blog(/|$)(.*)
            pathType: ImplementationSpecific
    tls:
      enabled: true
      secretName: localhost-blog-tls
      clusterIssuer: ""

docs:
  ingress:
    hosts:
      - host: localhost
        paths:
          - path: /docs
            pathType: Prefix
    tls:
      enabled: true
      secretName: localhost-docs-tls
      clusterIssuer: ""

supportAdmin:
  ingress:
    enabled: true
    annotations:
      argocd.argoproj.io/sync-wave: "1"
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2
    hosts:
      - host: localhost
        paths:
          - path: /models(/|$)(.*)
            pathType: ImplementationSpecific
    tls:
      enabled: true
      secretName: localhost-support-admin-tls
      clusterIssuer: ""

modelDiscovery:
  extraEnv:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: shahrah-secret
          key: MODEL_DISCOVERY_DATABASE_URL
  ingress:
    enabled: true
    annotations:
      argocd.argoproj.io/sync-wave: "-1"
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /api/$2
    hosts:
      - host: localhost
        paths:
          - path: /api/v1(/|$)(.*)
            pathType: ImplementationSpecific
    tls:
      enabled: true
      secretName: localhost-model-discovery-tls
      clusterIssuer: ""

migrations:
  enabled: true
  mainDb:
    enabled: false
  modelDiscovery:
    enabled: true

externalServices:
  postgres:
    enabled: true
    name: postgres
    externalName: host.docker.internal
    port: 5432
  redis:
    enabled: true
    name: redis
    externalName: host.docker.internal
    port: 6379
