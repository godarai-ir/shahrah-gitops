global:
  imageRegistry: registry.distr.sh/godar
  imageTag: sha-45b16b9e74959a6bdd7866fe4f23dd8376ad4842
imagePullSecrets:
- regcred
config:
  create: true
  name: shahrah-config
  data:
    SHAHRAH_MODEL_DISCOVERY_URL: http://model-discovery:3002/api/v1
    SHAHRAH_CONTROL_PLANE_URL: http://control-plane:4000
    MODEL_DISCOVERY_CORS_ORIGIN: https://tenant-admin.staging.shahrah.ir,https://catalog.staging.shahrah.ir
    MODEL_DISCOVERY_API_BASE_INTERNAL: http://model-discovery:3002/api/v1
    NEXT_PUBLIC_MODEL_DISCOVERY_APP_URL: https://catalog.staging.shahrah.ir/catalog
    SUPPORT_ADMIN_ORIGIN: https://support-admin.staging.shahrah.ir
    SHAHRAH_BASE_DOMAIN: localhost
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    CLICKHOUSE_DB: sharah_db
    CLICKHOUSE_USER: sharah_user
    CLICKHOUSE_HTTP_PORT: '8123'
    CLICKHOUSE_NATIVE_PORT: '9000'
    TYPESENSE_HOST: typesense.staging.internal
    TYPESENSE_PORT: '8108'
    TYPESENSE_PROTOCOL: https
    TUNNEL_SERVER_URL: http://tunnel-server:8082
    TUNNEL_CLIENT_URL: http://tunnel-client:8081
    SILK_ROAD_URL: http://silk-road:8083
    SMTP_HOST: mailpit
    SMTP_PORT: '1025'
    SMTP_FROM: no-reply@staging.shahrah.ir
    EMAIL_SENDING_ENABLED: 'true'
secrets:
  create: false
  name: shahrah-secret
  data: {}
controlPlane:
  image:
    tag: sha-9ceee2fad5795a25d7ac91b938dfb63201b2ad3c
  env:
    TRACE_RETENTION_CLEANUP_ENABLED: "true"
    TRACE_RETENTION_CLEANUP_INTERVAL_MS: "3600000"
    TRACE_RETENTION_CLEANUP_TIMEOUT_MS: "30000"
  ingress:
    hosts:
    - host: api.staging.shahrah.ir
      paths:
      - path: /
        pathType: Prefix
    tls:
      enabled: true
      secretName: api-staging-shahrah-ir-tls
      clusterIssuer: letsencrypt-prod
tenantAdmin:
  image:
    tag: sha-9ceee2fad5795a25d7ac91b938dfb63201b2ad3c
  envFromConfigKeys:
  - SHAHRAH_CONTROL_PLANE_URL
  - SHAHRAH_MODEL_DISCOVERY_URL
  envFromSecretKeys:
  - MASTER_KEY
  ingress:
    hosts:
    - host: '*.localhost'
      paths:
      - path: /
        pathType: Prefix
    tls:
      enabled: true
      secretName: localhost-tenant-admin-tls
      clusterIssuer: ''
website:
  image:
    tag: sha-9ceee2fad5795a25d7ac91b938dfb63201b2ad3c
  ingress:
    hosts:
    - host: localhost
      paths:
      - path: /
        pathType: Prefix
    tls:
      enabled: true
      secretName: localhost-website-tls
      clusterIssuer: ''
blog:
  image:
    tag: sha-9ceee2fad5795a25d7ac91b938dfb63201b2ad3c
  ingress:
    annotations:
      nginx.ingress.kubernetes.io/use-regex: 'true'
      nginx.ingress.kubernetes.io/rewrite-target: /$2
    hosts:
    - host: localhost
      paths:
      - path: /blog(/|$)(.*)
        pathType: ImplementationSpecific
    tls:
      enabled: true
      secretName: localhost-blog-tls
      clusterIssuer: ''
docs:
  image:
    tag: sha-9ceee2fad5795a25d7ac91b938dfb63201b2ad3c
  ingress:
    hosts:
    - host: localhost
      paths:
      - path: /docs
        pathType: Prefix
    tls:
      enabled: true
      secretName: localhost-docs-tls
      clusterIssuer: ''
supportAdmin:
  image:
    tag: sha-9ceee2fad5795a25d7ac91b938dfb63201b2ad3c
  probes:
    readiness:
      path: /
    liveness:
      path: /
  ingress:
    enabled: true
    annotations:
      argocd.argoproj.io/sync-wave: '1'
    hosts:
    - host: support-admin.staging.shahrah.ir
      paths:
      - path: /
        pathType: Prefix
    tls:
      enabled: true
      secretName: support-admin-staging-shahrah-ir-tls
      clusterIssuer: letsencrypt-prod
modelDiscoveryWeb:
  enabled: true
  image:
    tag: v0.1.0
  ingress:
    enabled: true
    annotations:
      argocd.argoproj.io/sync-wave: '1'
    hosts:
    - host: catalog.staging.shahrah.ir
      paths:
      - path: /catalog
        pathType: Prefix
    tls:
      enabled: true
      secretName: catalog-staging-shahrah-ir-tls
      clusterIssuer: letsencrypt-prod
modelDiscovery:
  image:
    tag: sha-9ceee2fad5795a25d7ac91b938dfb63201b2ad3c
  extraEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: shahrah-secret
        key: MODEL_DISCOVERY_DATABASE_URL
  ingress:
    enabled: false
migrations:
  enabled: true
  mainDb:
    enabled: false
    image:
      tag: sha-9ceee2fad5795a25d7ac91b938dfb63201b2ad3c
  clickhouse:
    enabled: true
  modelDiscovery:
    enabled: true
    image:
      tag: sha-9ceee2fad5795a25d7ac91b938dfb63201b2ad3c
silkRoad:
  image:
    tag: sha-9ceee2fad5795a25d7ac91b938dfb63201b2ad3c
tunnelServer:
  image:
    tag: sha-9ceee2fad5795a25d7ac91b938dfb63201b2ad3c
tunnelClient:
  image:
    tag: sha-9ceee2fad5795a25d7ac91b938dfb63201b2ad3c
externalServices:
  postgres:
    enabled: false
  redis:
    enabled: true
    name: redis
    externalName: host.docker.internal
    port: 6379
  clickhouse:
    enabled: true
    name: clickhouse
    externalName: host.docker.internal
    port: 9000
mailpit:
  enabled: true
  webroot: /mailpit
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
    - host: localhost
      paths:
      - path: /mailpit
        pathType: Prefix
    tls:
      enabled: true
      secretName: localhost-mailpit-tls
      clusterIssuer: ''
postgres:
  enabled: true
  persistence:
    size: 20Gi
