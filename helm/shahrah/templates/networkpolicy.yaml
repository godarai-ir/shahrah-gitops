{{- $root := . -}}
{{- $workloads := dict
  "control-plane" .Values.controlPlane
  "metrics-dlq-replayer" .Values.metricsDlqReplayer
  "model-discovery" .Values.modelDiscovery
  "model-discovery-web" .Values.modelDiscoveryWeb
  "support-admin" .Values.supportAdmin
  "silk-road" .Values.silkRoad
  "tenant-admin" .Values.tenantAdmin
  "website" .Values.website
  "blog" .Values.blog
  "docs" .Values.docs
-}}
{{- range $name, $cfg := $workloads }}
{{- if and $cfg.enabled $cfg.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "shahrah.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if $cfg.networkPolicy.ingress }}
    {{- toYaml $cfg.networkPolicy.ingress | nindent 4 }}
    {{- else }}
    - from:
      - podSelector: {}
    {{- end }}
  egress:
    {{- if $cfg.networkPolicy.egress }}
    {{- toYaml $cfg.networkPolicy.egress | nindent 4 }}
    {{- else }}
    - to:
      - podSelector: {}
    {{- end }}
{{- end }}
{{- end }}
