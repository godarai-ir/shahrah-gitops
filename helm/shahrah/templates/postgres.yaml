{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.postgres.initdb.configMapName | default "postgres-initdb" }}
  labels:
    {{- include "shahrah.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
data:
  01-create-model-discovery.sql: |
    SELECT 'CREATE DATABASE {{ .Values.postgres.initdb.modelDiscoveryDatabase }}'
    WHERE NOT EXISTS (
      SELECT FROM pg_database WHERE datname = '{{ .Values.postgres.initdb.modelDiscoveryDatabase }}'
    )\gexec
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.headlessService.name | default "postgres-headless" }}
  labels:
    {{- include "shahrah.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port | default 5432 }}
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.service.name | default "postgres" }}
  labels:
    {{- include "shahrah.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port | default 5432 }}
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.postgres.name | default "postgres" }}
  labels:
    {{- include "shahrah.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  serviceName: {{ .Values.postgres.headlessService.name | default "postgres-headless" }}
  replicas: {{ .Values.postgres.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "shahrah.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
        {{- with .Values.postgres.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.postgres.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range $s := .Values.imagePullSecrets }}
        - name: {{ $s }}
        {{- end }}
      {{- end }}
      {{- with .Values.postgres.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.postgres.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.service.port | default 5432 }}
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.postgres.auth.usernameSecretKey | default "POSTGRES_USER" }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.postgres.auth.passwordSecretKey | default "POSTGRES_PASSWORD" }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.postgres.auth.databaseSecretKey | default "POSTGRES_DB" }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.postgres.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d/01-create-model-discovery.sql
              subPath: 01-create-model-discovery.sql
              readOnly: true
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: {{ .Values.postgres.probes.readiness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.postgres.probes.readiness.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.postgres.probes.readiness.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.postgres.probes.readiness.failureThreshold | default 6 }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: {{ .Values.postgres.probes.liveness.initialDelaySeconds | default 15 }}
            periodSeconds: {{ .Values.postgres.probes.liveness.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.postgres.probes.liveness.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.postgres.probes.liveness.failureThreshold | default 6 }}
      volumes:
        - name: initdb
          configMap:
            name: {{ .Values.postgres.initdb.configMapName | default "postgres-initdb" }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "shahrah.labels" . | nindent 10 }}
          app.kubernetes.io/component: postgres
      spec:
        accessModes:
          {{- toYaml .Values.postgres.persistence.accessModes | nindent 10 }}
        {{- with .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size | quote }}
{{- end }}
