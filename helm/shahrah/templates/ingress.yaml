{{- $root := . -}}
{{- $workloads := dict
  "control-plane" .Values.controlPlane
  "model-discovery" .Values.modelDiscovery
  "support-admin" .Values.supportAdmin
  "silk-road" .Values.silkRoad
  "tunnel-server" .Values.tunnelServer
  "tunnel-client" .Values.tunnelClient
  "tenant-admin" .Values.tenantAdmin
  "website" .Values.website
  "blog" .Values.blog
  "docs" .Values.docs
-}}
{{- range $name, $cfg := $workloads }}
{{- if and $cfg.enabled $cfg.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "shahrah.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  annotations:
    {{- if $cfg.ingress.className }}
    kubernetes.io/ingress.class: {{ $cfg.ingress.className | quote }}
    {{- end }}
    {{- if $cfg.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $cfg.ingress.tls.clusterIssuer | quote }}
    {{- end }}
    {{- with $cfg.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if $cfg.ingress.className }}
  ingressClassName: {{ $cfg.ingress.className }}
  {{- end }}
  rules:
    {{- range $host := $cfg.ingress.hosts }}
    - host: {{ $host.host | quote }}
      http:
        paths:
          {{- range $p := $host.paths }}
          - path: {{ $p.path }}
            pathType: {{ $p.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $cfg.service.port | default $cfg.containerPort }}
          {{- end }}
    {{- end }}
  {{- if and $cfg.ingress.tls.enabled $cfg.ingress.tls.secretName }}
  tls:
    - secretName: {{ $cfg.ingress.tls.secretName }}
      hosts:
        {{- range $host := $cfg.ingress.hosts }}
        - {{ $host.host | quote }}
        {{- end }}
  {{- end }}
{{- end }}
{{- end }}
