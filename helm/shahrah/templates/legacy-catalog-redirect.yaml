{{- if .Values.legacyCatalogRedirect.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legacy-catalog-redirect
  labels:
    {{- include "shahrah.labels" . | nindent 4 }}
    app.kubernetes.io/component: legacy-catalog-redirect
  annotations:
    kubernetes.io/ingress.class: {{ .Values.legacyCatalogRedirect.className | quote }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/permanent-redirect: {{ .Values.legacyCatalogRedirect.targetURL | quote }}
    nginx.ingress.kubernetes.io/permanent-redirect-code: {{ .Values.legacyCatalogRedirect.statusCode | quote }}
    {{- if .Values.legacyCatalogRedirect.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.legacyCatalogRedirect.tls.clusterIssuer | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.legacyCatalogRedirect.className }}
  rules:
    - host: {{ .Values.legacyCatalogRedirect.host | quote }}
      http:
        paths:
          - path: {{ .Values.legacyCatalogRedirect.path }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.legacyCatalogRedirect.backendService }}
                port:
                  number: {{ .Values.legacyCatalogRedirect.backendPort }}
  {{- if and .Values.legacyCatalogRedirect.tls.enabled .Values.legacyCatalogRedirect.tls.secretName }}
  tls:
    - secretName: {{ .Values.legacyCatalogRedirect.tls.secretName }}
      hosts:
        - {{ .Values.legacyCatalogRedirect.host | quote }}
  {{- end }}
{{- end }}
