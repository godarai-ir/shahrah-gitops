{{- $root := . -}}
{{- $workloads := dict
  "control-plane" .Values.controlPlane
  "metrics-dlq-replayer" .Values.metricsDlqReplayer
  "model-discovery" .Values.modelDiscovery
  "model-discovery-web" .Values.modelDiscoveryWeb
  "support-admin" .Values.supportAdmin
  "silk-road" .Values.silkRoad
  "tunnel-server" .Values.tunnelServer
  "tunnel-client" .Values.tunnelClient
  "tenant-admin" .Values.tenantAdmin
  "website" .Values.website
  "blog" .Values.blog
  "docs" .Values.docs
-}}
{{- range $name, $cfg := $workloads }}
{{- if and $cfg.enabled $cfg.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "shahrah.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $cfg.autoscaling.minReplicas | default 2 }}
  maxReplicas: {{ $cfg.autoscaling.maxReplicas | default 8 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cfg.autoscaling.targetCPUUtilizationPercentage | default 70 }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $cfg.autoscaling.targetMemoryUtilizationPercentage | default 75 }}
{{- end }}
{{- end }}
