{{- if and .Values.externalServices.postgres.enabled (not .Values.postgres.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.externalServices.postgres.name | default "postgres" }}
  labels:
    {{- include "shahrah.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  type: ExternalName
  externalName: {{ .Values.externalServices.postgres.externalName | quote }}
  ports:
    - name: postgres
      port: {{ .Values.externalServices.postgres.port | default 5432 }}
      targetPort: {{ .Values.externalServices.postgres.port | default 5432 }}
{{- end }}

{{- if .Values.externalServices.redis.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.externalServices.redis.name | default "redis" }}
  labels:
    {{- include "shahrah.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  type: ExternalName
  externalName: {{ .Values.externalServices.redis.externalName | quote }}
  ports:
    - name: redis
      port: {{ .Values.externalServices.redis.port | default 6379 }}
      targetPort: {{ .Values.externalServices.redis.port | default 6379 }}
{{- end }}

{{- if and .Values.externalServices.clickhouse.enabled (not .Values.clickhouse.enabled) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.externalServices.clickhouse.name | default "clickhouse" }}
  labels:
    {{- include "shahrah.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  type: ExternalName
  externalName: {{ .Values.externalServices.clickhouse.externalName | quote }}
  ports:
    - name: clickhouse
      port: {{ .Values.externalServices.clickhouse.port | default 9000 }}
      targetPort: {{ .Values.externalServices.clickhouse.port | default 9000 }}
{{- end }}
