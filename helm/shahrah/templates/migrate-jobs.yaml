{{- if and .Values.migrations.enabled .Values.migrations.mainDb.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-main-db
  labels:
    {{- include "shahrah.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate-main-db
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-5"
spec:
  backoffLimit: {{ .Values.migrations.mainDb.backoffLimit | default 3 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate-main-db
    spec:
      restartPolicy: OnFailure
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range $s := .Values.imagePullSecrets }}
        - name: {{ $s }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z {{ if .Values.postgres.enabled }}{{ .Values.postgres.service.name | default "postgres" }}{{ else }}{{ .Values.externalServices.postgres.name | default "postgres" }}{{ end }} {{ .Values.externalServices.postgres.port | default .Values.postgres.service.port | default 5432 }}; do echo waiting for postgres; sleep 2; done
      containers:
        - name: goose
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.migrations.mainDb.image.repository }}:{{ .Values.migrations.mainDb.image.tag | default .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.migrations.mainDb.image.pullPolicy | default "IfNotPresent" }}
          command:
            {{- toYaml .Values.migrations.mainDb.command | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.migrations.mainDb.databaseUrlSecretKey | default "DATABASE_URL" }}
{{- end }}

{{- if and .Values.migrations.enabled .Values.migrations.clickhouse.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-clickhouse
  labels:
    {{- include "shahrah.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate-clickhouse
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-6"
spec:
  backoffLimit: {{ .Values.migrations.clickhouse.backoffLimit | default 3 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate-clickhouse
    spec:
      restartPolicy: OnFailure
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range $s := .Values.imagePullSecrets }}
        - name: {{ $s }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: wait-for-clickhouse
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z {{ if .Values.clickhouse.enabled }}{{ .Values.clickhouse.service.name | default "clickhouse" }}{{ else }}{{ .Values.externalServices.clickhouse.name | default .Values.migrations.clickhouse.serviceName | default "clickhouse" }}{{ end }} {{ if .Values.clickhouse.enabled }}{{ .Values.clickhouse.service.nativePort | default 9000 }}{{ else }}{{ .Values.externalServices.clickhouse.port | default .Values.migrations.clickhouse.servicePort | default 9000 }}{{ end }}; do echo waiting for clickhouse; sleep 2; done
      containers:
        - name: migrate-clickhouse
          image: "{{ .Values.migrations.clickhouse.image.repository }}:{{ .Values.migrations.clickhouse.image.tag }}"
          imagePullPolicy: {{ .Values.migrations.clickhouse.image.pullPolicy | default "IfNotPresent" }}
          command:
            - sh
            - -c
            - |
              set -eu
              dsn="${CLICKHOUSE_DSN#clickhouse://}"
              creds="${dsn%@*}"
              target_and_query="${dsn#*@}"
              target="${target_and_query%%\?*}"
              hostport="${target%%/*}"
              database="${target#*/}"
              host="${hostport%%:*}"
              port="${hostport##*:}"
              username="${creds%%:*}"
              password="${creds#*:}"
              for migration in $(find /migrations -maxdepth 1 -type f -name '*.sql' | sort); do
                echo "Applying ${migration}"
                clickhouse-client \
                  --host "${host}" \
                  --port "${port}" \
                  --user "${username}" \
                  --password "${password}" \
                  --database "${database}" \
                  --multiquery < "${migration}"
              done
          env:
            - name: CLICKHOUSE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.migrations.clickhouse.dsnSecretKey | default "CLICKHOUSE_DSN" }}
          volumeMounts:
            - name: clickhouse-migrations
              mountPath: /migrations
      volumes:
        - name: clickhouse-migrations
          configMap:
            name: {{ .Values.migrations.clickhouse.configMapName | default "clickhouse-migrations" }}
{{- end }}

