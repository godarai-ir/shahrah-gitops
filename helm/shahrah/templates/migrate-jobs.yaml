{{- if and .Values.migrations.enabled .Values.migrations.mainDb.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-main-db
  labels:
    {{- include "shahrah.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate-main-db
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-5"
spec:
  backoffLimit: {{ .Values.migrations.mainDb.backoffLimit | default 3 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate-main-db
    spec:
      restartPolicy: OnFailure
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range $s := .Values.imagePullSecrets }}
        - name: {{ $s }}
        {{- end }}
      {{- end }}
      {{- if ne (.Values.migrations.mainDb.waitForPostgres.enabled | toString) "false" }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z {{ if .Values.postgres.enabled }}{{ .Values.postgres.service.name | default "postgres" }}{{ else }}{{ .Values.externalServices.postgres.name | default "postgres" }}{{ end }} {{ .Values.externalServices.postgres.port | default .Values.postgres.service.port | default 5432 }}; do echo waiting for postgres; sleep 2; done
      {{- end }}
      containers:
        - name: goose
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.migrations.mainDb.image.repository }}:goose-{{ .Values.migrations.mainDb.image.tag | default .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.migrations.mainDb.image.pullPolicy | default "IfNotPresent" }}
          command:
            {{- toYaml .Values.migrations.mainDb.command | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.migrations.mainDb.databaseUrlSecretKey | default "DATABASE_URL" }}
{{- end }}

