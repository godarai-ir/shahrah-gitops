{{- if and .Values.migrations.enabled .Values.migrations.clickhouse.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-clickhouse
  labels:
    {{- include "shahrah.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate-clickhouse
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-6"
spec:
  backoffLimit: {{ .Values.migrations.clickhouse.backoffLimit | default 3 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate-clickhouse
    spec:
      restartPolicy: OnFailure
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range $s := .Values.imagePullSecrets }}
        - name: {{ $s }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: wait-for-clickhouse
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z {{ if .Values.clickhouse.enabled }}{{ .Values.clickhouse.service.name | default "clickhouse" }}{{ else }}{{ .Values.externalServices.clickhouse.name | default .Values.migrations.clickhouse.serviceName | default "clickhouse" }}{{ end }} {{ if .Values.clickhouse.enabled }}{{ .Values.clickhouse.service.nativePort | default 9000 }}{{ else }}{{ .Values.externalServices.clickhouse.port | default .Values.migrations.clickhouse.servicePort | default 9000 }}{{ end }}; do echo waiting for clickhouse; sleep 2; done
      containers:
        - name: migrate-clickhouse
          image: "{{ .Values.migrations.clickhouse.image.repository }}:{{ .Values.migrations.clickhouse.image.tag }}"
          imagePullPolicy: {{ .Values.migrations.clickhouse.image.pullPolicy | default "IfNotPresent" }}
          command:
            - sh
            - -c
            - |
              set -eu
              {{ if .Values.migrations.clickhouse.replicatedDatabase.enabled }}
              clickhouse-client \
                --host "${CLICKHOUSE_HOST}" \
                --port "${CLICKHOUSE_PORT}" \
                --user "${CLICKHOUSE_USERNAME}" \
                --password "${CLICKHOUSE_PASSWORD}" \
                --database default \
                --query "CREATE DATABASE IF NOT EXISTS \`${CLICKHOUSE_DATABASE}\` ENGINE = Replicated('/clickhouse/databases/${CLICKHOUSE_DATABASE}', '{shard}', '{replica}')"
              {{ end }}
              for migration in $(find -L /migrations -maxdepth 1 -type f -name '*.sql' | sort); do
                echo "Applying ${migration}"
                clickhouse-client \
                  --host "${CLICKHOUSE_HOST}" \
                  --port "${CLICKHOUSE_PORT}" \
                  --user "${CLICKHOUSE_USERNAME}" \
                  --password "${CLICKHOUSE_PASSWORD}" \
                  --database "${CLICKHOUSE_DATABASE}" \
                  --multiquery < "${migration}"
              done
          env:
            - name: CLICKHOUSE_HOST
              value: {{ if .Values.clickhouse.enabled }}{{ .Values.clickhouse.service.name | default "clickhouse" | quote }}{{ else }}{{ .Values.externalServices.clickhouse.name | default .Values.migrations.clickhouse.serviceName | default "clickhouse" | quote }}{{ end }}
            - name: CLICKHOUSE_PORT
              value: {{ if .Values.clickhouse.enabled }}{{ .Values.clickhouse.service.nativePort | default 9000 | quote }}{{ else }}{{ .Values.externalServices.clickhouse.port | default .Values.migrations.clickhouse.servicePort | default 9000 | quote }}{{ end }}
            - name: CLICKHOUSE_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.config.name }}
                  key: CLICKHOUSE_DB
            - name: CLICKHOUSE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.config.name }}
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.clickhouse.auth.passwordSecretKey | default "CLICKHOUSE_PASSWORD" }}
          volumeMounts:
            - name: clickhouse-migrations
              mountPath: /migrations
      volumes:
        - name: clickhouse-migrations
          configMap:
            name: {{ .Values.migrations.clickhouse.configMapName | default "clickhouse-migrations" }}
{{- end }}

