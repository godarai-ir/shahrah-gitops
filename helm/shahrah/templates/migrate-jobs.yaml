    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-4"
spec:
  backoffLimit: {{ .Values.migrations.modelDiscovery.backoffLimit | default 3 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: model-discovery-migrate
    spec:
      restartPolicy: OnFailure
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range $s := .Values.imagePullSecrets }}
        - name: {{ $s }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z {{ if .Values.postgres.enabled }}{{ .Values.postgres.service.name | default "postgres" }}{{ else }}{{ .Values.externalServices.postgres.name | default "postgres" }}{{ end }} {{ .Values.externalServices.postgres.port | default .Values.postgres.service.port | default 5432 }}; do echo waiting for postgres; sleep 2; done
      containers:
        - name: model-discovery-migrate
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.migrations.modelDiscovery.image.repository }}:{{ .Values.migrations.modelDiscovery.image.tag | default .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.migrations.modelDiscovery.image.pullPolicy | default "IfNotPresent" }}
