global:
  imageRegistry: registry.distr.sh/godar
  imageTag: sha-override-me
imagePullSecrets:
- regcred
config:
  create: true
  name: shahrah-config
  data:
    SHAHRAH_MODEL_DISCOVERY_URL: http://model-discovery:3002/api/v1
    SHAHRAH_CONTROL_PLANE_URL: http://control-plane:4000
    MODEL_DISCOVERY_CORS_ORIGIN: https://godarai.ir,https://*.godarai.ir
    NEXT_PUBLIC_MODEL_CATALOG_API_BASE: https://godarai.ir/catalog/api/v1
    NEXT_PUBLIC_MODEL_DISCOVERY_APP_URL: /catalog
    NEXT_PUBLIC_SITE_URL: https://godarai.ir
    SHAHRAH_TENANT_BASE_DOMAIN: godarai.ir
    MODEL_CATALOG_API_BASE_INTERNAL: http://model-discovery:3002/api/v1
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    CLICKHOUSE_DB: sharah_db
    CLICKHOUSE_USER: sharah_user
    CLICKHOUSE_HTTP_PORT: '8123'
    CLICKHOUSE_NATIVE_PORT: '9000'
    TYPESENSE_HOST: typesense.prod.internal
    TYPESENSE_PORT: '8108'
    TYPESENSE_PROTOCOL: https
    TUNNEL_SERVER_URL: http://tunnel-server:8082
    TUNNEL_CLIENT_URL: http://tunnel-client:8081
    SILK_ROAD_URL: http://silk-road:8083
    SMTP_HOST: smtp.prod.internal
    SMTP_PORT: '587'
    SMTP_FROM: noreply@godarai.ir
    EMAIL_SENDING_ENABLED: 'true'
    RESEND_FROM_EMAIL: noreply@godarai.ir
    RESEND_FROM_NAME: Godar-AI
    RESEND_REPLY_TO: support@godarai.ir
secrets:
  create: false
  name: shahrah-secret
  data: {}
redis:
  enabled: true
controlPlane:
  image:
    tag: sha-24bd70b0af8aa3bdd44078b8367d830b23c5b497
  env:
    NODE_ENV: production
  envFromConfigKeys:
  - REDIS_HOST
  - REDIS_PORT
  - TUNNEL_CLIENT_URL
  - SHAHRAH_MODEL_DISCOVERY_URL
  - EMAIL_SENDING_ENABLED
  - RESEND_FROM_EMAIL
  - RESEND_FROM_NAME
  - RESEND_REPLY_TO
  envFromSecretKeys:
  - DATABASE_URL
  - CLICKHOUSE_DSN
  - REDIS_PASSWORD
  - MASTER_KEY
  - OPENAI_API_KEY
  - SHAHRAH_DISCOVERY_TOKEN
  - RESEND_API_KEY
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
  pdb:
    enabled: true
    minAvailable: 2
  ingress:
    hosts:
    - host: godarai.ir
      paths:
      - path: /api
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
tenantAdmin:
  image:
    tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
  envFromConfigKeys:
  - SHAHRAH_CONTROL_PLANE_URL
  - SHAHRAH_MODEL_DISCOVERY_URL
  - NEXT_PUBLIC_MODEL_DISCOVERY_APP_URL
  - EMAIL_SENDING_ENABLED
  - RESEND_FROM_EMAIL
  - RESEND_FROM_NAME
  - RESEND_REPLY_TO
  envFromSecretKeys:
  - MASTER_KEY
  - RESEND_API_KEY
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
  ingress:
    hosts:
    - host: '*.godarai.ir'
      paths:
      - path: /
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
website:
  image:
    tag: sha-24bd70b0af8aa3bdd44078b8367d830b23c5b497
  envFromConfigKeys:
  - SHAHRAH_CONTROL_PLANE_URL
  - RESEND_FROM_EMAIL
  - RESEND_FROM_NAME
  - RESEND_REPLY_TO
  - SMTP_HOST
  - SMTP_PORT
  - SMTP_FROM
  - EMAIL_SENDING_ENABLED
  - NEXT_PUBLIC_SITE_URL
  - SHAHRAH_TENANT_BASE_DOMAIN
  envFromSecretKeys:
  - RESEND_API_KEY
  ingress:
    hosts:
    - host: godarai.ir
      paths:
      - path: /api/onboarding
        pathType: Prefix
      - path: /api/signup
        pathType: Prefix
      - path: /api/proxy/wallet
        pathType: Prefix
      - path: /
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
blog:
  image:
    tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
  ingress:
    hosts:
    - host: godarai.ir
      paths:
      - path: /blog
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
docs:
  image:
    tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
  ingress:
    hosts:
    - host: godarai.ir
      paths:
      - path: /docs
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
modelDiscovery:
  image:
    tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
  replicaCount: 3
  extraEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: shahrah-secret
        key: MODEL_DISCOVERY_DATABASE_URL
  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/use-regex: 'true'
      nginx.ingress.kubernetes.io/rewrite-target: /api/v1/$2
    hosts:
    - host: godarai.ir
      paths:
      - path: /catalog/api/v1(/|$)(.*)
        pathType: ImplementationSpecific
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
  pdb:
    enabled: true
    minAvailable: 2
supportAdmin:
  image:
    tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
  probes:
    readiness:
      type: tcp
      port: 3000
    liveness:
      type: tcp
      port: 3000
  ingress:
    enabled: true
    hosts:
    - host: godarai.ir
      paths:
      - path: /catalog
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
silkRoad:
  image:
    tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
tunnelServer:
  image:
    tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
tunnelClient:
  image:
    tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
migrations:
  enabled: true
  mainDb:
    enabled: false
    image:
      tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
  modelDiscovery:
    enabled: true
    image:
      tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
    command:
    - sh
    - -c
    - |
      set -e
      apk add --no-cache git
      rm -rf /tmp/truefoundry-models
      git clone --depth 1 https://github.com/truefoundry/models.git /tmp/truefoundry-models
      npx prisma migrate deploy
      npm run import:providers:yaml -- --providers-root /tmp/truefoundry-models/providers
externalServices:
  postgres:
    enabled: true
    name: postgres
    externalName: c781656f0ab24ceb9040b7f8bdbe5f6c.db.arvandbaas.ir
    port: 5432
postgres:
  enabled: false
  persistence:
    size: 100Gi
