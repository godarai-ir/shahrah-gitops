global:
  imageRegistry: registry.distr.sh/godar
  imageTag: sha-override-me
imagePullSecrets:
- regcred
config:
  create: true
  name: shahrah-config
  data:
    SHAHRAH_MODEL_DISCOVERY_URL: http://model-discovery:3002/api/v1
    SHAHRAH_CONTROL_PLANE_URL: http://control-plane:4000
    MODEL_DISCOVERY_CORS_ORIGIN: https://godarai.ir,https://*.godarai.ir
    NEXT_PUBLIC_MODEL_CATALOG_API_BASE: https://godarai.ir/catalog/api/v1
    NEXT_PUBLIC_MODEL_DISCOVERY_APP_URL: /catalog
    NEXT_PUBLIC_SITE_URL: https://godarai.ir
    MODEL_CATALOG_API_BASE_INTERNAL: http://model-discovery:3002/api/v1
    REDIS_HOST: redis.prod.internal
    REDIS_PORT: '6379'
    CLICKHOUSE_DB: sharah_db
    CLICKHOUSE_USER: sharah_user
    CLICKHOUSE_HTTP_PORT: '8123'
    CLICKHOUSE_NATIVE_PORT: '9000'
    TYPESENSE_HOST: typesense.prod.internal
    TYPESENSE_PORT: '8108'
    TYPESENSE_PROTOCOL: https
    TUNNEL_SERVER_URL: http://tunnel-server:8082
    TUNNEL_CLIENT_URL: http://tunnel-client:8081
    SILK_ROAD_URL: http://silk-road:8083
    SMTP_HOST: smtp.prod.internal
    SMTP_PORT: '587'
    SMTP_FROM: no-reply@godarai.ir
    EMAIL_SENDING_ENABLED: 'true'
secrets:
  create: false
  name: shahrah-secret
  data: {}
controlPlane:
  image:
    tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
  pdb:
    enabled: true
    minAvailable: 2
  ingress:
    hosts:
    - host: godarai.ir
      paths:
      - path: /api
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
tenantAdmin:
  image:
    tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
  envFromConfigKeys:
  - SHAHRAH_CONTROL_PLANE_URL
  - SHAHRAH_MODEL_DISCOVERY_URL
  - NEXT_PUBLIC_MODEL_DISCOVERY_APP_URL
  envFromSecretKeys:
  - MASTER_KEY
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
  ingress:
    hosts:
    - host: '*.godarai.ir'
      paths:
      - path: /
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
website:
  image:
    tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
  envFromConfigKeys:
  - SHAHRAH_CONTROL_PLANE_URL
  - SMTP_HOST
  - SMTP_PORT
  - SMTP_FROM
  - EMAIL_SENDING_ENABLED
  - NEXT_PUBLIC_SITE_URL
  ingress:
    hosts:
    - host: godarai.ir
      paths:
      - path: /
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
blog:
  image:
    tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
  ingress:
    hosts:
    - host: godarai.ir
      paths:
      - path: /blog
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
docs:
  image:
    tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
  ingress:
    hosts:
    - host: godarai.ir
      paths:
      - path: /docs
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
modelDiscovery:
  image:
    tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
  replicaCount: 3
  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/use-regex: 'true'
      nginx.ingress.kubernetes.io/rewrite-target: /api/v1/$2
    hosts:
    - host: godarai.ir
      paths:
      - path: /catalog/api/v1(/|$)(.*)
        pathType: ImplementationSpecific
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
  pdb:
    enabled: true
    minAvailable: 2
supportAdmin:
  image:
    tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
  ingress:
    enabled: true
    hosts:
    - host: godarai.ir
      paths:
      - path: /catalog
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
silkRoad:
  image:
    tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
tunnelServer:
  image:
    tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
tunnelClient:
  image:
    tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
migrations:
  enabled: false
  mainDb:
    image:
      tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
  modelDiscovery:
    image:
      tag: sha-a01b8604edb06a36f0f8819547fd48dc787f72d9
externalServices:
  postgres:
    enabled: true
    name: postgres
    externalName: c781656f0ab24ceb9040b7f8bdbe5f6c.db.arvandbaas.ir
    port: 5432
postgres:
  enabled: false
  persistence:
    size: 100Gi
