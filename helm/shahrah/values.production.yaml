global:
  imageRegistry: docker.io/delpak
  imageTag: sha-override-me
imagePullSecrets:
- regcred
config:
  create: true
  name: shahrah-config
  data:
    SHAHRAH_MODEL_DISCOVERY_URL: http://model-discovery:3002/api/v1
    SHAHRAH_CONTROL_PLANE_URL: http://control-plane:4000
    MODEL_DISCOVERY_CORS_ORIGIN: https://godarai.ir,https://*.godarai.ir
    NEXT_PUBLIC_MODEL_DISCOVERY_APP_URL: https://godarai.ir/catalog
    NEXT_PUBLIC_SITE_URL: https://godarai.ir
    SHAHRAH_BASE_DOMAIN: godarai.ir
    SHAHRAH_TENANT_BASE_DOMAIN: godarai.ir
    GODARAI_AUTH_BASE_URL: https://auth.godarai.ir
    GODARAI_TENANT_ORIGIN_TEMPLATE: https://{tenant}.godarai.ir
    MICROSOFT_TENANT_ID: common
    MODEL_DISCOVERY_API_BASE_INTERNAL: http://model-discovery:3002/api/v1
    SUPPORT_ADMIN_ORIGIN: https://admin.godarai.ir
    REDIS_HOST: redis.shahrah-production.svc.cluster.local
    REDIS_PORT: '6379'
    REDIS_SENTINEL_ADDRS: shahrah-redis-runtime-node-0.shahrah-redis-runtime-headless.shahrah-production.svc.cluster.local:26379,shahrah-redis-runtime-node-1.shahrah-redis-runtime-headless.shahrah-production.svc.cluster.local:26379,shahrah-redis-runtime-node-2.shahrah-redis-runtime-headless.shahrah-production.svc.cluster.local:26379
    REDIS_MASTER_NAME: mymaster
    METRICS_MODEL_DLQ_BACKEND: redis_stream
    METRICS_MODEL_DLQ_REDIS_SENTINEL_ADDRS: shahrah-redis-dlq-node-0.shahrah-redis-dlq-headless.shahrah-production.svc.cluster.local:26379,shahrah-redis-dlq-node-1.shahrah-redis-dlq-headless.shahrah-production.svc.cluster.local:26379,shahrah-redis-dlq-node-2.shahrah-redis-dlq-headless.shahrah-production.svc.cluster.local:26379
    METRICS_MODEL_DLQ_REDIS_MASTER_NAME: mymaster
    METRICS_MODEL_DLQ_STREAM: shahrah:observability:model-metrics:dlq:v1
    METRICS_MODEL_DLQ_POISON_STREAM: shahrah:observability:model-metrics:poison:v1
    METRICS_MODEL_DLQ_GROUP: metrics-dlq-replayer-v1
    METRICS_MODEL_DLQ_MAXLEN: '10000'
    METRICS_MODEL_DLQ_RETENTION: 168h
    METRICS_MODEL_DLQ_ENQUEUE_TIMEOUT_MS: '250'
    CLICKHOUSE_DB: sharah_db
    CLICKHOUSE_USER: sharah_user
    CLICKHOUSE_HTTP_PORT: '8123'
    CLICKHOUSE_NATIVE_PORT: '9000'
    METRICS_MODEL_ENABLED: 'true'
    TYPESENSE_HOST: typesense
    TYPESENSE_PORT: '8108'
    TYPESENSE_PROTOCOL: http
    TYPESENSE_COLLECTION_MODELS: models
    TYPESENSE_READS_ENABLED: 'true'
    TYPESENSE_READY_STRICT: 'true'
    SILK_ROAD_URL: http://silk-road:8083
    SMTP_HOST: smtp.prod.internal
    SMTP_PORT: '587'
    SMTP_FROM: noreply@godarai.ir
    EMAIL_SENDING_ENABLED: 'true'
    RESEND_FROM_EMAIL: noreply@godarai.ir
    RESEND_FROM_NAME: Godar-AI
    RESEND_REPLY_TO: support@godarai.ir
secrets:
  create: false
  name: shahrah-secret
  data: {}
typesense:
  enabled: true
  persistence:
    storageClassName: longhorn-prod-r2
privateFiles:
  enabled: true
  minio:
    persistence:
      storageClassName: longhorn-prod-r2
      size: 1Gi
  clamav:
    persistence:
      storageClassName: longhorn-prod-r2
redis:
  enabled: false
controlPlane:
  image:
    tag: v0.53.0
  env:
    NODE_ENV: production
    PRIVATE_FILES_S3_ENDPOINT: http://minio:9000
    PRIVATE_FILES_S3_REGION: us-east-1
    PRIVATE_FILES_S3_BUCKET: godarai-support
    PRIVATE_FILES_S3_FORCE_PATH_STYLE: 'true'
    SUPPORT_CLAMAV_ADDRESS: clamav:3310
    SUPPORT_CLAMAV_TIMEOUT: 30s
    PLATFORM_PROVIDER_CREDENTIAL_MODE: platform_store
    PLATFORM_PROVIDER_CREDENTIAL_ACTIVE_KEK_VERSION: prod-v1
    PLATFORM_PROVIDER_CREDENTIAL_ENVIRONMENT: production
    TRACE_RETENTION_CLEANUP_ENABLED: 'true'
    TRACE_RETENTION_CLEANUP_INTERVAL_MS: '3600000'
    TRACE_RETENTION_CLEANUP_TIMEOUT_MS: '30000'
  envFromConfigKeys:
  - REDIS_HOST
  - REDIS_PORT
  - REDIS_SENTINEL_ADDRS
  - REDIS_MASTER_NAME
  - SILK_ROAD_URL
  - SHAHRAH_MODEL_DISCOVERY_URL
  - METRICS_MODEL_ENABLED
  - METRICS_MODEL_DLQ_BACKEND
  - METRICS_MODEL_DLQ_REDIS_SENTINEL_ADDRS
  - METRICS_MODEL_DLQ_REDIS_MASTER_NAME
  - METRICS_MODEL_DLQ_STREAM
  - METRICS_MODEL_DLQ_POISON_STREAM
  - METRICS_MODEL_DLQ_GROUP
  - METRICS_MODEL_DLQ_MAXLEN
  - METRICS_MODEL_DLQ_RETENTION
  - METRICS_MODEL_DLQ_ENQUEUE_TIMEOUT_MS
  - EMAIL_SENDING_ENABLED
  - RESEND_FROM_EMAIL
  - RESEND_FROM_NAME
  - RESEND_REPLY_TO
  envFromSecretKeys:
  - DATABASE_URL
  - CLICKHOUSE_DSN
  - MASTER_KEY
  - OPENAI_API_KEY
  - SHAHRAH_DISCOVERY_TOKEN
  - RESEND_API_KEY
  - PLATFORM_PROVIDER_CREDENTIAL_KEKS_JSON
  - PLATFORM_PROVIDER_CREDENTIAL_FINGERPRINT_KEY
  - TENANT_PROVIDER_CREDENTIAL_ACTIVE_KEK_VERSION
  - TENANT_PROVIDER_CREDENTIAL_KEKS_JSON
  - TENANT_PROVIDER_CREDENTIAL_FINGERPRINT_KEY
  - PRIVATE_FILES_S3_ACCESS_KEY
  - PRIVATE_FILES_S3_SECRET_KEY
  - SHAHRAH_SMART_CACHE_EMBEDDING_BASE_URL
  - SHAHRAH_SMART_CACHE_EMBEDDING_API_KEY
  extraEnv:
  - name: TRACE_OTLP_ENDPOINT
    value: opentelemetry-collector.observability.svc.cluster.local:4317
  - name: TRACE_OTLP_INSECURE
    value: 'true'
  - name: TRACE_OTLP_SERVICE_NAME
    value: shahrah-control-plane
  - name: TRACE_DEFAULT_SAMPLE_RATE
    value: '0.01'
  - name: TRACE_SLOW_REQUEST_MS
    value: '1500'
  - name: TRACE_CAPTURE_POLICY
    value: metadata-only
  - name: TRACE_PAYLOAD_ENCRYPTION_KEY
    valueFrom:
      secretKeyRef:
        name: shahrah-secret
        key: TRACE_PAYLOAD_ENCRYPTION_KEY
  - name: TRACE_PII_HASH_SALT
    valueFrom:
      secretKeyRef:
        name: shahrah-secret
        key: TRACE_PII_HASH_SALT
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: shahrah-redis-runtime
        key: redis-password
  - name: REDIS_SENTINEL_PASSWORD
    valueFrom:
      secretKeyRef:
        name: shahrah-redis-runtime
        key: redis-password
  - name: METRICS_MODEL_DLQ_REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: shahrah-redis-dlq
        key: redis-password
  - name: METRICS_MODEL_DLQ_REDIS_SENTINEL_PASSWORD
    valueFrom:
      secretKeyRef:
        name: shahrah-redis-dlq
        key: redis-password
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
  pdb:
    enabled: true
    minAvailable: 2
  ingress:
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: '330'
      nginx.ingress.kubernetes.io/proxy-send-timeout: '330'
    hosts:
    - host: godarai.ir
      paths:
      - path: /api
        pathType: Prefix
    - host: '*.godarai.ir'
      paths:
      - path: /v1
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
tenantAdmin:
  image:
    tag: v0.52.0
  envFromConfigKeys:
  - SHAHRAH_CONTROL_PLANE_URL
  - SHAHRAH_MODEL_DISCOVERY_URL
  - NEXT_PUBLIC_MODEL_DISCOVERY_APP_URL
  - EMAIL_SENDING_ENABLED
  - RESEND_FROM_EMAIL
  - RESEND_FROM_NAME
  - RESEND_REPLY_TO
  - GODARAI_AUTH_BASE_URL
  envFromSecretKeys:
  - MASTER_KEY
  - RESEND_API_KEY
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
  ingress:
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 30m
      nginx.ingress.kubernetes.io/proxy-buffering: 'off'
      nginx.ingress.kubernetes.io/proxy-read-timeout: '330'
      nginx.ingress.kubernetes.io/proxy-send-timeout: '330'
    hosts:
    - host: '*.godarai.ir'
      paths:
      - path: /
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
website:
  image:
    tag: v0.46.0
  envFromConfigKeys:
  - SHAHRAH_CONTROL_PLANE_URL
  - RESEND_FROM_EMAIL
  - RESEND_FROM_NAME
  - RESEND_REPLY_TO
  - SMTP_HOST
  - SMTP_PORT
  - SMTP_FROM
  - EMAIL_SENDING_ENABLED
  - NEXT_PUBLIC_SITE_URL
  - SHAHRAH_BASE_DOMAIN
  - SHAHRAH_TENANT_BASE_DOMAIN
  - GODARAI_AUTH_BASE_URL
  - GODARAI_TENANT_ORIGIN_TEMPLATE
  - MICROSOFT_TENANT_ID
  envFromSecretKeys:
  - DATABASE_URL
  - MASTER_KEY
  - RESEND_API_KEY
  - BETTER_AUTH_SECRET
  - GOOGLE_CLIENT_ID
  - GOOGLE_CLIENT_SECRET
  - GITHUB_CLIENT_ID
  - GITHUB_CLIENT_SECRET
  - MICROSOFT_CLIENT_ID
  - MICROSOFT_CLIENT_SECRET
  ingress:
    hosts:
    - host: auth.godarai.ir
      paths:
      - path: /
        pathType: Prefix
    - host: godarai.ir
      paths:
      - path: /api/contact
        pathType: Prefix
      - path: /api/login-discovery
        pathType: Prefix
      - path: /api/onboarding
        pathType: Prefix
      - path: /api/signup
        pathType: Prefix
      - path: /api/proxy/wallet
        pathType: Prefix
      - path: /
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
blog:
  image:
    tag: v0.42.0
  env:
    PUBLIC_SITE_URL: https://godarai.ir/blog
    PUBLIC_BASE_PATH: /blog
    PUBLIC_ALLOWED_HOSTS: godarai.ir
  ingress:
    hosts:
    - host: godarai.ir
      paths:
      - path: /blog
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
docs:
  image:
    tag: v0.44.0
  ingress:
    hosts:
    - host: godarai.ir
      paths:
      - path: /docs
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
modelDiscovery:
  image:
    tag: v0.43.0
  replicaCount: 3
  extraEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: shahrah-secret
        key: MODEL_DISCOVERY_DATABASE_URL
  ingress:
    enabled: false
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
  pdb:
    enabled: true
    minAvailable: 2
modelDiscoveryWeb:
  image:
    tag: v0.31.0
  replicaCount: 2
  ingress:
    enabled: false
catalogPathIngress:
  enabled: true
  className: nginx
  host: godarai.ir
  path: /catalog
  backendService: model-discovery-web
  backendPort: 3000
  tls:
    enabled: true
    secretName: godarai-ir-tls
    clusterIssuer: ''
supportAdmin:
  image:
    tag: v0.37.0
  probes:
    readiness:
      type: tcp
      port: 3000
    liveness:
      type: tcp
      port: 3000
  ingress:
    enabled: true
    hosts:
    - host: admin.godarai.ir
      paths:
      - path: /
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
metricsDlqReplayer:
  enabled: true
  image:
    tag: v0.53.0
  env:
    CLICKHOUSE_REQUIRED: 'true'
  envFromConfigKeys:
  - METRICS_MODEL_DLQ_BACKEND
  - METRICS_MODEL_DLQ_REDIS_SENTINEL_ADDRS
  - METRICS_MODEL_DLQ_REDIS_MASTER_NAME
  - METRICS_MODEL_DLQ_STREAM
  - METRICS_MODEL_DLQ_POISON_STREAM
  - METRICS_MODEL_DLQ_GROUP
  - METRICS_MODEL_DLQ_MAXLEN
  - METRICS_MODEL_DLQ_RETENTION
  envFromSecretKeys:
  - CLICKHOUSE_DSN
  extraEnv:
  - name: METRICS_MODEL_DLQ_REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: shahrah-redis-dlq
        key: redis-password
  - name: METRICS_MODEL_DLQ_REDIS_SENTINEL_PASSWORD
    valueFrom:
      secretKeyRef:
        name: shahrah-redis-dlq
        key: redis-password
  replicaCount: 1
  networkPolicy:
    enabled: true
    ingress:
    - from:
      - podSelector: {}
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: observability
      ports:
      - protocol: TCP
        port: 9091
    egress:
    - to:
      - podSelector: {}
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
silkRoad:
  image:
    tag: v0.41.0
  replicaCount: 2
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/component: silk-road
        topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/component: silk-road
  pdb:
    enabled: true
    minAvailable: 1
  env:
    SILK_ROAD_ENABLE_MOCK_PROVIDER: 'true'
    SILK_ROAD_MOCK_ALLOWED_TENANT_IDS: a6ea1c25-d710-4e31-8dac-d2651bf1c796
    SILK_ROAD_MOCK_ALLOWED_DEPLOYMENT_IDS: provider-account:713500dd-4ac2-48a7-a4d0-fde804b571a8:mock/chat
    SILK_ROAD_EGRESS_PROXY_URL: http://10.10.0.190:1443
    SILK_ROAD_EGRESS_PROXY_REQUIRED: 'true'
    HTTP_PROXY: http://10.10.0.190:1443
    HTTPS_PROXY: http://10.10.0.190:1443
    NO_PROXY: localhost,127.0.0.1,.svc,.cluster.local
  envFromSecretKeys:
  - DEEPSEEK_USER_ID_HMAC_SECRET
  networkPolicy:
    enabled: true
    ingress:
    - from:
      - podSelector:
          matchLabels:
            app.kubernetes.io/component: control-plane
      ports:
      - protocol: TCP
        port: 8083
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: observability
      ports:
      - protocol: TCP
        port: 8083
    egress:
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
    - to:
      - ipBlock:
          cidr: 10.10.0.190/32
      ports:
      - protocol: TCP
        port: 1443
tunnelServer:
  image:
    tag: v0.37.0
  replicaCount: 2
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/component: tunnel-server
        topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/component: tunnel-server
  pdb:
    enabled: true
    minAvailable: 1
tunnelClient:
  image:
    tag: v0.37.0
  replicaCount: 2
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/component: tunnel-client
        topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/component: tunnel-client
  pdb:
    enabled: true
    minAvailable: 1
migrations:
  enabled: true
  mainDb:
    enabled: true
    waitForPostgres:
      enabled: false
    image:
      tag: v0.29.0
  clickhouse:
    enabled: true
    replicatedDatabase:
      enabled: true
  modelDiscovery:
    enabled: true
    waitForPostgres:
      enabled: false
    image:
      tag: v0.43.1
    command:
    - pnpm
    - exec
    - prisma
    - migrate
    - deploy
  modelDiscoveryCatalogImport:
    enabled: true
    waitForPostgres:
      enabled: false
    image:
      tag: v0.43.1
    providersRoot: /app/apps/model-discovery/providers
    clearMissing: true
    clearMissingProviders: true
  supportAdmin:
    waitForPostgres:
      enabled: false
    image:
      tag: v0.37.0
externalServices:
  postgres:
    enabled: true
    name: postgres
    externalName: c781656f0ab24ceb9040b7f8bdbe5f6c.db.arvandbaas.ir
    port: 5432
  clickhouse:
    enabled: false
    name: clickhouse
    externalName: clickhouse.prod.internal
    port: 9000
clickhouse:
  enabled: true
  workloadEnabled: false
  service:
    nativeTargetPort: tcp
    selector:
      app: shahrah-clickhouse-clickhouse
  persistence:
    size: 10Gi
    storageClassName: longhorn-prod-r2
  storageClass:
    create: false
postgres:
  enabled: false
  persistence:
    size: 100Gi
