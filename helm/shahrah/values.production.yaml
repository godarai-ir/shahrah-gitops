global:
  imageRegistry: registry.distr.sh/godar
  imageTag: sha-override-me
imagePullSecrets:
- regcred
config:
  create: true
  name: shahrah-config
  data:
    SHAHRAH_MODEL_DISCOVERY_URL: http://model-discovery:3002/api/v1
    SHAHRAH_CONTROL_PLANE_URL: http://control-plane:4000
    MODEL_DISCOVERY_CORS_ORIGIN: https://godarai.ir,https://*.godarai.ir
    NEXT_PUBLIC_MODEL_DISCOVERY_APP_URL: https://godarai.ir/catalog
    NEXT_PUBLIC_SITE_URL: https://godarai.ir
    SHAHRAH_BASE_DOMAIN: godarai.ir
    SHAHRAH_TENANT_BASE_DOMAIN: godarai.ir
    MODEL_DISCOVERY_API_BASE_INTERNAL: http://model-discovery:3002/api/v1
    SUPPORT_ADMIN_ORIGIN: https://admin.godarai.ir
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    CLICKHOUSE_DB: sharah_db
    CLICKHOUSE_USER: sharah_user
    CLICKHOUSE_HTTP_PORT: '8123'
    CLICKHOUSE_NATIVE_PORT: '9000'
    TYPESENSE_HOST: typesense.prod.internal
    TYPESENSE_PORT: '8108'
    TYPESENSE_PROTOCOL: https
    TUNNEL_SERVER_URL: http://tunnel-server:8082
    TUNNEL_CLIENT_URL: http://tunnel-client:8081
    SILK_ROAD_URL: http://silk-road:8083
    SMTP_HOST: smtp.prod.internal
    SMTP_PORT: '587'
    SMTP_FROM: noreply@godarai.ir
    EMAIL_SENDING_ENABLED: 'true'
    RESEND_FROM_EMAIL: noreply@godarai.ir
    RESEND_FROM_NAME: Godar-AI
    RESEND_REPLY_TO: support@godarai.ir
secrets:
  create: false
  name: shahrah-secret
  data: {}
redis:
  enabled: true
controlPlane:
  image:
    tag: v0.14.0
  env:
    NODE_ENV: production
    TRACE_RETENTION_CLEANUP_ENABLED: 'true'
    TRACE_RETENTION_CLEANUP_INTERVAL_MS: '3600000'
    TRACE_RETENTION_CLEANUP_TIMEOUT_MS: '30000'
  envFromConfigKeys:
  - REDIS_HOST
  - REDIS_PORT
  - TUNNEL_CLIENT_URL
  - SHAHRAH_MODEL_DISCOVERY_URL
  - EMAIL_SENDING_ENABLED
  - RESEND_FROM_EMAIL
  - RESEND_FROM_NAME
  - RESEND_REPLY_TO
  envFromSecretKeys:
  - DATABASE_URL
  - CLICKHOUSE_DSN
  - REDIS_PASSWORD
  - MASTER_KEY
  - OPENAI_API_KEY
  - SHAHRAH_DISCOVERY_TOKEN
  - RESEND_API_KEY
  extraEnv:
  - name: TRACE_OTLP_ENDPOINT
    value: opentelemetry-collector.observability.svc.cluster.local:4317
  - name: TRACE_OTLP_INSECURE
    value: 'true'
  - name: TRACE_OTLP_SERVICE_NAME
    value: shahrah-control-plane
  - name: TRACE_DEFAULT_SAMPLE_RATE
    value: '0.01'
  - name: TRACE_SLOW_REQUEST_MS
    value: '1500'
  - name: TRACE_CAPTURE_POLICY
    value: metadata-only
  - name: TRACE_PAYLOAD_ENCRYPTION_KEY
    valueFrom:
      secretKeyRef:
        name: shahrah-secret
        key: TRACE_PAYLOAD_ENCRYPTION_KEY
  - name: TRACE_PII_HASH_SALT
    valueFrom:
      secretKeyRef:
        name: shahrah-secret
        key: TRACE_PII_HASH_SALT
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
  pdb:
    enabled: true
    minAvailable: 2
  ingress:
    hosts:
    - host: godarai.ir
      paths:
      - path: /api
        pathType: Prefix
    - host: '*.godarai.ir'
      paths:
      - path: /v1
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
tenantAdmin:
  image:
    tag: v0.13.0
  envFromConfigKeys:
  - SHAHRAH_CONTROL_PLANE_URL
  - SHAHRAH_MODEL_DISCOVERY_URL
  - NEXT_PUBLIC_MODEL_DISCOVERY_APP_URL
  - EMAIL_SENDING_ENABLED
  - RESEND_FROM_EMAIL
  - RESEND_FROM_NAME
  - RESEND_REPLY_TO
  envFromSecretKeys:
  - MASTER_KEY
  - RESEND_API_KEY
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
  ingress:
    hosts:
    - host: '*.godarai.ir'
      paths:
      - path: /
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
website:
  image:
    tag: v0.17.1
  envFromConfigKeys:
  - SHAHRAH_CONTROL_PLANE_URL
  - RESEND_FROM_EMAIL
  - RESEND_FROM_NAME
  - RESEND_REPLY_TO
  - SMTP_HOST
  - SMTP_PORT
  - SMTP_FROM
  - EMAIL_SENDING_ENABLED
  - NEXT_PUBLIC_SITE_URL
  - SHAHRAH_BASE_DOMAIN
  - SHAHRAH_TENANT_BASE_DOMAIN
  envFromSecretKeys:
  - RESEND_API_KEY
  ingress:
    hosts:
    - host: godarai.ir
      paths:
      - path: /api/contact
        pathType: Prefix
      - path: /api/login-discovery
        pathType: Prefix
      - path: /api/onboarding
        pathType: Prefix
      - path: /api/signup
        pathType: Prefix
      - path: /api/proxy/wallet
        pathType: Prefix
      - path: /
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
blog:
  image:
    tag: v0.12.0
  ingress:
    hosts:
    - host: godarai.ir
      paths:
      - path: /blog
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
docs:
  image:
    tag: v0.12.0
  ingress:
    hosts:
    - host: godarai.ir
      paths:
      - path: /docs
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
modelDiscovery:
  image:
    tag: v0.13.0
  replicaCount: 3
  extraEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: shahrah-secret
        key: MODEL_DISCOVERY_DATABASE_URL
  ingress:
    enabled: false
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
  pdb:
    enabled: true
    minAvailable: 2
modelDiscoveryWeb:
  image:
    tag: v0.4.0
  replicaCount: 2
  ingress:
    enabled: false
catalogPathIngress:
  enabled: true
  className: nginx
  host: godarai.ir
  path: /catalog
  backendService: model-discovery-web
  backendPort: 3000
  tls:
    enabled: true
    secretName: godarai-ir-tls
    clusterIssuer: ''
supportAdmin:
  image:
    tag: v0.12.0
  probes:
    readiness:
      type: tcp
      port: 3000
    liveness:
      type: tcp
      port: 3000
  ingress:
    enabled: true
    hosts:
    - host: admin.godarai.ir
      paths:
      - path: /
        pathType: Prefix
    tls:
      enabled: true
      secretName: godarai-ir-tls
      clusterIssuer: ''
silkRoad:
  image:
    tag: v0.12.0
tunnelServer:
  image:
    tag: v0.12.0
tunnelClient:
  image:
    tag: v0.12.0
migrations:
  enabled: true
  mainDb:
    enabled: true
    image:
      tag: v0.12.0
  clickhouse:
    enabled: true
  modelDiscovery:
    enabled: true
    image:
      tag: v0.13.0
    command:
    - sh
    - -c
    - 'set -e

      apk add --no-cache git

      rm -rf /tmp/truefoundry-models

      git clone --depth 1 https://github.com/truefoundry/models.git /tmp/truefoundry-models

      npx prisma migrate deploy

      npm run import:providers:yaml -- --providers-root /tmp/truefoundry-models/providers

      '
  supportAdmin:
    image:
      tag: v0.12.0
externalServices:
  postgres:
    enabled: true
    name: postgres
    externalName: c781656f0ab24ceb9040b7f8bdbe5f6c.db.arvandbaas.ir
    port: 5432
  clickhouse:
    enabled: false
    name: clickhouse
    externalName: clickhouse.prod.internal
    port: 9000
clickhouse:
  enabled: true
  persistence:
    size: 10Gi
    storageClassName: local-path
  storageClass:
    create: false
postgres:
  enabled: false
  persistence:
    size: 100Gi
