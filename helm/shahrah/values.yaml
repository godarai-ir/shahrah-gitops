    enabled: false
    ingress: []
    egress: []
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: [ALL]
  env:
    PORT: "3002"
  envFromConfigKeys:
    - REDIS_HOST
    - REDIS_PORT
    - TYPESENSE_HOST
    - TYPESENSE_PORT
    - TYPESENSE_PROTOCOL
    - TYPESENSE_COLLECTION_MODELS
    - TYPESENSE_READS_ENABLED
    - TYPESENSE_READY_STRICT
