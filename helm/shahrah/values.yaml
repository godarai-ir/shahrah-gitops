# GodarChat: ONE shared LibreChat (MULTI_TENANT_MODE=host) that serves every tenant at
# https://<slug>.<TENANT_HOST_BASE_DOMAIN>. Tenants are registered by the control plane
# (CHAT_PROVISIONING_*) through the private provisioning port; nothing is deployed per tenant.
# Scales like the other workloads: stateless pods, state in MongoDB (helm/mongodb), Redis
# (apps/librechat-redis) and S3 (MinIO, privateFiles).
librechat:
  enabled: true
  image:
    repository: godar-ai
    namePrefix: librechat
    # The GodarChat image is published with the bare release tag (docker.io/delpak/godar-ai:v0.9.0-rc2),
    # without the <workload>- prefix the other services use. fullTag is used verbatim as the image tag.
    fullTag: ""
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 3
  containerPort: 3080
  revisionHistoryLimit: 5
  labels: {}
  annotations: {}
  podLabels: {}
  podAnnotations: {}
  serviceAccountName: ""
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: librechat
  topologySpreadConstraints: []
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  service:
    enabled: true
    type: ClusterIP
    port: 3080
    targetPort: http
    # Tenant provisioning API. Reachable only by the control plane (NetworkPolicy); no Ingress.
    extraPorts:
      - name: provisioning
        port: 3081
        targetPort: 3081
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 100m
      # Streamed completions (SSE): never buffer.
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    hosts:
      # The wildcard covers every tenant. LibreChat resolves the tenant from the Host header.
      - host: "*.chat.example.com"
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      # *.godarai.ir does not cover two-level hosts: see platform/godarai-tls/chat-wildcard-certificate.yaml.
      secretName: godarai-ir-chat-tls
      clusterIssuer: ""
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 2
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ingress-nginx
            podSelector:
              matchLabels:
                app.kubernetes.io/name: ingress-nginx
        ports:
          - { protocol: TCP, port: 3080 }
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/component: control-plane
        ports:
          - { protocol: TCP, port: 3081 }
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
        ports:
          - { protocol: UDP, port: 53 }
          - { protocol: TCP, port: 53 }
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: mongodb
        ports:
          - { protocol: TCP, port: 27017 }
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/instance: librechat-redis
        ports:
          - { protocol: TCP, port: 6379 }
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/component: minio
        ports:
          - { protocol: TCP, port: 9000 }
      # https://<slug>.<issuer domain>: OIDC discovery, token, userinfo, JWKS and the /v1 gateway.
      # The pod reaches it through the public address.
      - to:
          - ipBlock:
              cidr: 0.0.0.0/0
        ports:
          - { protocol: TCP, port: 443 }
          - { protocol: TCP, port: 80 }
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 2Gi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: [ALL]
  # Host mode refuses to start with DOMAIN_CLIENT, DOMAIN_SERVER, OPENID_ISSUER, OPENID_CLIENT_*,
  # OPENID_REUSE_TOKENS, ADMIN_PANEL_URL, local file storage or without Redis. Do not add them.
  env:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: "3080"
    CONFIG_PATH: /app/librechat.yaml
    MULTI_TENANT_MODE: host
    TENANT_HOST_BASE_DOMAIN: chat.example.com
    TENANT_OIDC_ISSUER_TEMPLATE: https://{slug}.example.com
    TENANT_ISOLATION_STRICT: "true"
    TENANT_PROVISIONING_PORT: "3081"
    USE_REDIS: "true"
    # Meilisearch is not deployed.
    SEARCH: "false"
    ALLOW_EMAIL_LOGIN: "false"
    ALLOW_REGISTRATION: "false"
    ALLOW_SOCIAL_LOGIN: "true"
    ALLOW_SOCIAL_REGISTRATION: "true"
    ALLOW_PASSWORD_RESET: "false"
    OPENID_BUTTON_LABEL: Godar
    APP_TITLE: "گدار چت"
    CUSTOM_FOOTER: "گدار چت"
    # Path only. In host mode the authorization request is built as <tenant origin><OPENID_CALLBACK_URL>;
    # unset, the redirect_uri becomes https://<slug>.chat.<domain>undefined and sign-in is rejected.
    OPENID_CALLBACK_URL: /oauth/openid/callback
    AWS_ENDPOINT_URL: http://minio:9000
    AWS_REGION: us-east-1
    AWS_BUCKET_NAME: godarai-chat
    AWS_FORCE_PATH_STYLE: "true"
  envFromConfigKeys: []
  envFromSecretKeys: []
  # Secret `librechat-secret`, created out of band (never committed). Keys:
  #   CREDS_KEY, CREDS_IV              deployment-wide encryption of stored credentials AND of every
  #                                    tenant's OIDC client secret. Losing them loses that data: back up.
  #   JWT_SECRET, JWT_REFRESH_SECRET   token signing
  #   OPENID_SESSION_SECRET            signs the sign-in session of every tenant
  #   TENANT_PROVISIONING_TOKEN        >= 32 chars; same value as CHAT_PROVISIONING_TOKEN in shahrah-secret
  #   MONGO_URI                        mongodb://librechat:<pw>@mongodb-0.mongodb-headless:27017,...,mongodb-2...:27017/LibreChat?replicaSet=rs0&authSource=LibreChat
  #   REDIS_URI                        redis://:<pw>@librechat-redis-master:6379
  #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY   MinIO user limited to the chat bucket (created by librechat-bucket-init)
  #   USER_ASSERTION_PRIVATE_KEY       optional Ed25519 PEM that signs {{LIBRECHAT_USER_ASSERTION}}; its public half is
  #                                    USER_ASSERTION_PUBLIC_KEY_PEM in shahrah-secret. Unset, the header is omitted.
  extraEnv:
    - { name: CREDS_KEY, valueFrom: { secretKeyRef: { name: librechat-secret, key: CREDS_KEY } } }
    - { name: CREDS_IV, valueFrom: { secretKeyRef: { name: librechat-secret, key: CREDS_IV } } }
    - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: librechat-secret, key: JWT_SECRET } } }
    - { name: JWT_REFRESH_SECRET, valueFrom: { secretKeyRef: { name: librechat-secret, key: JWT_REFRESH_SECRET } } }
    - { name: OPENID_SESSION_SECRET, valueFrom: { secretKeyRef: { name: librechat-secret, key: OPENID_SESSION_SECRET } } }
    - { name: TENANT_PROVISIONING_TOKEN, valueFrom: { secretKeyRef: { name: librechat-secret, key: TENANT_PROVISIONING_TOKEN } } }
    - { name: MONGO_URI, valueFrom: { secretKeyRef: { name: librechat-secret, key: MONGO_URI } } }
    - { name: REDIS_URI, valueFrom: { secretKeyRef: { name: librechat-secret, key: REDIS_URI } } }
    - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: librechat-secret, key: AWS_ACCESS_KEY_ID } } }
    - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: librechat-secret, key: AWS_SECRET_ACCESS_KEY } } }
    - { name: USER_ASSERTION_PRIVATE_KEY, valueFrom: { secretKeyRef: { name: librechat-secret, key: USER_ASSERTION_PRIVATE_KEY, optional: true } } }
  # librechat.yaml, shared by all tenants. `{slug}` in a baseURL becomes the requesting tenant's slug.
  config: |
    version: 1.3.17
    cache: true
    # S3 is mandatory in host mode: local storage is not tenant-aware and is refused at startup.
    fileStrategy: s3
    registration:
      socialLogins: ["openid"]
    endpoints:
      custom:
        - name: "Godar"
          # Each user stores their own Godar personal access token (PAT) from the key button in the
          # model picker. Until one is stored the picker lists no models; afterwards it lists exactly
          # the models that PAT may use. The gateway attributes usage to the tenant.
          apiKey: "user_provided"
          requireUserKey: true
          baseURL: "https://{slug}.example.com/v1"
          models:
            default: ["auto"]
            fetch: true
          modelDisplay: "fqn"
          titleConvo: true
          modelDisplayLabel: "Godar"
  volumes:
    - name: librechat-config
      configMap:
        name: librechat-config
    - name: logs
      emptyDir: {}
    - name: uploads
      emptyDir: {}
  volumeMounts:
    - name: librechat-config
      mountPath: /app/librechat.yaml
      subPath: librechat.yaml
      readOnly: true
    - name: logs
      mountPath: /app/logs
    - name: uploads
      mountPath: /app/uploads
  probes:
    readiness:
      enabled: true
      type: http
      path: /health
      port: http
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    liveness:
      enabled: true
      type: http
      path: /health
      port: http
      initialDelaySeconds: 40
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 6
    startup:
      enabled: true
      type: http
      path: /health
      port: http
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60

