  headlessService:
    name: clickhouse-headless
  auth:
    databaseConfigKey: CLICKHOUSE_DB
    usernameConfigKey: CLICKHOUSE_USER
    passwordSecretKey: CLICKHOUSE_PASSWORD
  persistence:
    size: 20Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: ""
  storageClass:
    create: false
    name: longhorn-clickhouse
    provisioner: driver.longhorn.io
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    volumeBindingMode: Immediate
    parameters:
      numberOfReplicas: "1"
      staleReplicaTimeout: "30"
      fromBackup: ""
      fsType: ext4
      dataLocality: disabled
      unmapMarkSnapChainRemoved: ignored
      disableRevisionCounter: "true"
      dataEngine: v1
      backupTargetName: default
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi
  probes:
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 12
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 6
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgres:
