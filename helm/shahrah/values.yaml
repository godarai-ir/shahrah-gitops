  envFromSecretKeys:
    - MODEL_DISCOVERY_DATABASE_URL
    - REDIS_PASSWORD
    - TYPESENSE_API_KEY
    - MASTER_KEY
    - JWT_SECRET
  extraEnv: []
  volumes: []
  volumeMounts: []
  probes:
    readiness:
      enabled: true
      type: http
      path: /api/v1/ready
      port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
