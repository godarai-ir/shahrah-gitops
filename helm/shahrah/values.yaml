nameOverride: ""
fullnameOverride: ""

global:
  imageRegistry: docker.io/delpak
  imageTag: "sha-override-me"

imagePullSecrets: []

config:
  create: true
  name: shahrah-config
  data:
    SHAHRAH_MODEL_DISCOVERY_URL: http://model-discovery:3002/api/v1
    SHAHRAH_CONTROL_PLANE_URL: http://control-plane:4000
    MODEL_DISCOVERY_CORS_ORIGIN: https://tenant-admin.example.com,https://catalog.example.com
    MODEL_DISCOVERY_API_BASE_INTERNAL: http://model-discovery:3002/api/v1
    NEXT_PUBLIC_MODEL_DISCOVERY_APP_URL: https://catalog.example.com
    SUPPORT_ADMIN_ORIGIN: https://admin.example.com
    REDIS_HOST: redis-managed.example.local
    REDIS_PORT: "6379"
    CLICKHOUSE_DB: sharah_db
    CLICKHOUSE_USER: sharah_user
    CLICKHOUSE_HTTP_PORT: "8123"
    CLICKHOUSE_NATIVE_PORT: "9000"
    TYPESENSE_HOST: typesense-managed.example.local
    TYPESENSE_PORT: "8108"
    TYPESENSE_PROTOCOL: https
    TYPESENSE_COLLECTION_MODELS: models
    TYPESENSE_READS_ENABLED: "true"
    TYPESENSE_READY_STRICT: "true"
    TYPESENSE_DATA_DIR: /data
    TYPESENSE_ENABLE_CORS: "true"
    SILK_ROAD_ADDR: :8083
    SILK_ROAD_URL: http://silk-road:8083
    SMTP_HOST: smtp.example.local
    SMTP_PORT: "587"
    SMTP_FROM: no-reply@example.com
    EMAIL_SENDING_ENABLED: "true"
    SHAHRAH_BASE_DOMAIN: shahrah.example.com

redis:
  enabled: false
  name: redis
  image:
    repository: redis
    tag: "8-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  auth:
    secretName: ""
    passwordKey: REDIS_PASSWORD

secrets:
  create: false
  name: shahrah-secret
  data: {}

defaultWorkload:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

mailpit:
  enabled: false
  webroot: /
  image:
    repository: axllent/mailpit
    tag: v1.27
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    smtpPort: 1025
    uiPort: 8025
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts: []
    tls:
      enabled: false
      secretName: ""
      clusterIssuer: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

typesense:
  enabled: false
  image:
    repository: typesense/typesense
    tag: "29.1"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 8108
  persistence:
    enabled: true
    storageClassName: local-path
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

privateFiles:
  enabled: false
  endpoint: http://minio:9000
  region: us-east-1
  bucket: godarai-support
  forcePathStyle: "true"
  secretName: ""
  accessKeySecretKey: PRIVATE_FILES_S3_ACCESS_KEY
  secretKeySecretKey: PRIVATE_FILES_S3_SECRET_KEY
  minio:
    image:
      repository: minio/minio
      tag: latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
      pullPolicy: IfNotPresent
    clientImage:
      repository: minio/mc
      tag: latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
      pullPolicy: IfNotPresent
    service:
      name: minio
      port: 9000
    # Public S3 endpoint. Browsers load presigned URLs (e.g. LibreChat avatars) from the host the
    # URL was signed for, so it must be reachable outside the cluster. The S3 API still requires
    # signed requests; anonymous access stays denied.
    ingress:
      enabled: false
      className: nginx
      annotations: {}
      host: ""
      tls:
        enabled: false
        secretName: ""
        clusterIssuer: ""
    persistence:
      enabled: true
      storageClassName: local-path
      size: 20Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  clamav:
    image:
      repository: clamav/clamav
      tag: stable@sha256:d06c1d6a451d616e1dd79b42f44c8c8c291bba9cf4e75ebc4d0e43c1c6dd87bb
      pullPolicy: IfNotPresent
    service:
      name: clamav
      port: 3310
    persistence:
      enabled: true
      storageClassName: local-path
      size: 2Gi
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi

controlPlane:
  enabled: true
  image:
    repository: godar-ai
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  revisionHistoryLimit: 5
  containerPort: 4000
  labels: {}
  annotations: {}
  podLabels: {}
  podAnnotations: {}
  serviceAccountName: ""
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  service:
    enabled: true
    type: ClusterIP
    port: 4000
    targetPort: http
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
      - host: api.shahrah.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      secretName: shahrah-control-plane-tls
      clusterIssuer: letsencrypt-prod
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 1
  networkPolicy:
    enabled: false
    ingress: []
    egress: []

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  env:
    TRACE_RETENTION_CLEANUP_ENABLED: "true"
    TRACE_RETENTION_CLEANUP_INTERVAL_MS: "3600000"
    TRACE_RETENTION_CLEANUP_TIMEOUT_MS: "30000"
  envFromConfigKeys:
    - REDIS_HOST
    - REDIS_PORT
    - SILK_ROAD_URL
    - SHAHRAH_MODEL_DISCOVERY_URL
    - EMAIL_SENDING_ENABLED
    - SMTP_HOST
    - SMTP_PORT
    - SMTP_FROM
  envFromSecretKeys:
    - DATABASE_URL
    - CLICKHOUSE_DSN
    - REDIS_PASSWORD
    - MASTER_KEY
    - OPENAI_API_KEY
    - SHAHRAH_DISCOVERY_TOKEN
  extraEnv: []
  volumes: []
  volumeMounts: []
  probes:
    readiness:
      enabled: true
      type: http
      path: /ready
      port: http
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 6
    liveness:
      enabled: true
      type: http
      path: /health
      port: http
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 6
    startup:
      enabled: false
      type: http
      path: /health
      port: http

metricsDlqReplayer:
  enabled: false
  image:
