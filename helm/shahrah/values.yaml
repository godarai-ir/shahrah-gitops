nameOverride: ""
fullnameOverride: ""

global:
  imageRegistry: ghcr.io/delpak
  imageTag: "sha-override-me"

imagePullSecrets: []

config:
  create: true
  name: shahrah-config
  data:
    SHAHRAH_MODEL_DISCOVERY_URL: http://model-discovery:3002/api/v1
    MODEL_DISCOVERY_CORS_ORIGIN: https://tenant-admin.example.com,https://support-admin.example.com
    NEXT_PUBLIC_MODEL_CATALOG_API_BASE: https://support-admin.example.com/api/v1
    MODEL_CATALOG_API_BASE_INTERNAL: http://model-discovery:3002/api/v1
    REDIS_HOST: redis-managed.example.local
    REDIS_PORT: "6379"
    CLICKHOUSE_DB: sharah_db
    CLICKHOUSE_USER: sharah_user
    CLICKHOUSE_HTTP_PORT: "8123"
    CLICKHOUSE_NATIVE_PORT: "9000"
    TYPESENSE_HOST: typesense-managed.example.local
    TYPESENSE_PORT: "8108"
    TYPESENSE_PROTOCOL: https
    TYPESENSE_DATA_DIR: /data
    TYPESENSE_ENABLE_CORS: "true"
    TUNNEL_CLIENT_ADDR: :8081
    TUNNEL_SERVER_ADDR: :8082
    TUNNEL_SERVER_URL: http://tunnel-server:8082
    TUNNEL_CLIENT_URL: http://tunnel-client:8081
    SILK_ROAD_ADDR: :8083
    SILK_ROAD_URL: http://silk-road:8083
    SMTP_HOST: smtp.example.local
    SMTP_PORT: "587"
    SMTP_FROM: no-reply@example.com
    EMAIL_SENDING_ENABLED: "true"

redis:
  enabled: false
  name: redis
  image:
    repository: redis
    tag: "8-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  auth:
    secretName: ""
    passwordKey: REDIS_PASSWORD

secrets:
  create: false
  name: shahrah-secret
  data: {}

defaultWorkload:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

mailpit:
  enabled: false
  webroot: /
  image:
    repository: axllent/mailpit
    tag: v1.27
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    smtpPort: 1025
    uiPort: 8025
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts: []
    tls:
      enabled: false
      secretName: ""
      clusterIssuer: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

controlPlane:
  enabled: true
  image:
    repository: shahrah/control-plane
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  revisionHistoryLimit: 5
  containerPort: 4000
  labels: {}
  annotations: {}
  podLabels: {}
  podAnnotations: {}
  serviceAccountName: ""
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  service:
    enabled: true
    type: ClusterIP
    port: 4000
    targetPort: http
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
      - host: api.shahrah.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      secretName: shahrah-control-plane-tls
      clusterIssuer: letsencrypt-prod
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 1
  networkPolicy:
    enabled: false
    ingress: []
    egress: []
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  env: {}
  envFromConfigKeys:
    - REDIS_HOST
    - REDIS_PORT
    - TUNNEL_CLIENT_URL
    - SHAHRAH_MODEL_DISCOVERY_URL
    - EMAIL_SENDING_ENABLED
    - SMTP_HOST
    - SMTP_PORT
    - SMTP_FROM
  envFromSecretKeys:
    - DATABASE_URL
    - CLICKHOUSE_DSN
    - REDIS_PASSWORD
    - MASTER_KEY
    - OPENAI_API_KEY
    - SHAHRAH_DISCOVERY_TOKEN
  extraEnv: []
  volumes: []
  volumeMounts: []
  probes:
    readiness:
      enabled: true
      type: http
      path: /ready
      port: http
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 6
    liveness:
      enabled: true
      type: http
      path: /health
      port: http
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 6
    startup:
      enabled: false
      type: http
      path: /health
      port: http

