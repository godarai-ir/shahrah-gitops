name: Mirror Quay Images

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_IMAGE: docker.io/delpak/godar-ai

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - source: quay.io/argoproj/argocd:v3.4.3
            target_tag: mirror-argocd-v3.4.3
          - source: quay.io/prometheus-operator/prometheus-operator:v0.91.0
            target_tag: mirror-prometheus-operator-v0.91.0
          - source: quay.io/prometheus-operator/prometheus-config-reloader:v0.91.0
            target_tag: mirror-prometheus-config-reloader-v0.91.0
          - source: quay.io/prometheus/prometheus:v3.12.0-distroless
            target_tag: mirror-prometheus-v3.12.0-distroless
          - source: quay.io/prometheus/node-exporter:v1.11.1-distroless
            target_tag: mirror-node-exporter-v1.11.1-distroless
          - source: quay.io/kiwigrid/k8s-sidecar:2.7.3
            target_tag: mirror-k8s-sidecar-2.7.3
          - source: quay.io/jetstack/cert-manager-controller:v1.20.2
            target_tag: mirror-cert-manager-controller-v1.20.2
          - source: quay.io/jetstack/cert-manager-cainjector:v1.20.2
            target_tag: mirror-cert-manager-cainjector-v1.20.2
          - source: quay.io/jetstack/cert-manager-webhook:v1.20.2
            target_tag: mirror-cert-manager-webhook-v1.20.2
          - source: quay.io/jetstack/cert-manager-acmesolver:v1.20.2
            target_tag: mirror-cert-manager-acmesolver-v1.20.2
          - source: ghcr.io/mohammadv184/cert-manager-webhook-arvancloud:latest
            target_tag: mirror-cert-manager-webhook-arvancloud-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror image
        run: |
          docker buildx imagetools create \
            --tag "${TARGET_IMAGE}:${{ matrix.image.target_tag }}" \
            "${{ matrix.image.source }}"

      - name: Verify mirrored image
        run: docker buildx imagetools inspect "${TARGET_IMAGE}:${{ matrix.image.target_tag }}"
