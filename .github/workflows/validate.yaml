name: Validate GitOps

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.1.4

      - name: Helm lint
        run: helm lint helm/shahrah

      - name: Helm template default
        run: helm template shahrah helm/shahrah -f helm/shahrah/values.yaml > /tmp/shahrah-default.yaml

      - name: Helm template staging
        run: helm template shahrah helm/shahrah -f helm/shahrah/values.yaml -f helm/shahrah/values.staging.yaml > /tmp/shahrah-staging.yaml

      - name: Helm template production
        run: helm template shahrah helm/shahrah -f helm/shahrah/values.yaml -f helm/shahrah/values.production.yaml > /tmp/shahrah-production.yaml

      - name: GodarChat is rendered with host multi-tenancy and S3
        run: |
          grep -q 'name: MULTI_TENANT_MODE' /tmp/shahrah-production.yaml
          grep -q 'fileStrategy: s3' /tmp/shahrah-production.yaml
          # Host mode refuses these at startup; they must never be rendered for GodarChat.
          ! grep -E 'name: (DOMAIN_CLIENT|DOMAIN_SERVER|OPENID_ISSUER|OPENID_CLIENT_ID|OPENID_CLIENT_SECRET|OPENID_REUSE_TOKENS|ADMIN_PANEL_URL)$' /tmp/shahrah-production.yaml
          # Each tenant's admin panel origin comes from ADMIN_HOST_BASE_DOMAIN; the panel refuses
          # fixed browser-facing origins in host mode.
          grep -q 'name: ADMIN_HOST_BASE_DOMAIN' /tmp/shahrah-production.yaml
          ! grep -E 'name: (VITE_API_BASE_URL|VITE_BASE_PATH)$' /tmp/shahrah-production.yaml

      - name: Helm lint and template mongodb
        run: |
          helm lint helm/mongodb
          helm template mongodb helm/mongodb -n shahrah-production > /tmp/mongodb.yaml
