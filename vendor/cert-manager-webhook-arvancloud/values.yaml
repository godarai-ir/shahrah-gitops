# The GroupName here is used to identify your company or business unit that
# created this webhook.
# This name will need to be referenced in each Issuer's `webhook` stanza to
# inform cert-manager of where to send ChallengePayload resources in order to
# solve the DNS01 challenge.
# This group name should be **unique**, hence using your own company's domain
# here is recommended.
groupName: acme.arvancloud.ir

# Number of replicas
replicaCount: 1

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

image:
  repository: ghcr.io/mohammadv184/cert-manager-webhook-arvancloud
  tag: latest
  pullPolicy: IfNotPresent

# Optional image pull secrets for the webhook pod, e.g. [{ name: regcred }]
# when the image is mirrored into a private registry.
imagePullSecrets: []

# Optional extra environment variables injected into the webhook container.
# Used here to route outbound ArvanCloud DNS API traffic through the cluster
# egress proxy (HTTPS_PROXY / HTTP_PROXY / NO_PROXY).
extraEnv: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 443

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
