apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-webhook-arvancloud
  namespace: argocd
  labels:
    app.kubernetes.io/name: cert-manager-webhook-arvancloud
    app.kubernetes.io/part-of: platform
spec:
  project: default
  source:
    repoURL: https://mohammad-abbasi.me/cert-manager-webhook-arvancloud
    chart: cert-manager-webhook-arvancloud
    targetRevision: 0.1.1
    helm:
      releaseName: cert-manager-webhook-arvancloud
      values: |
        # Hygiene: pin the DNS-01 solver image to an immutable tag instead of the
        # mutable ":latest". v0.1.1 is byte-identical to the image running today
        # (ghcr.io/mohammadv184/cert-manager-webhook-arvancloud:latest resolves to the
        # same manifest digest sha256:179bee5e...), so this is a no-op for the live pod
        # but prevents a future upstream ":latest" re-push from silently changing prod.
        # The chart's default repository (ghcr.io/mohammadv184/...) is intentionally kept.
        image:
          tag: v0.1.1
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
