apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: observability
spec:
  project: default
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: kube-prometheus-stack-grafana
      namespace: observability
      jsonPointers:
        - /data/admin-password
    - group: apps
      kind: Deployment
      name: kube-prometheus-stack-grafana
      namespace: observability
      jqPathExpressions:
        - .spec.template.metadata.annotations."checksum/secret"
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 86.2.0
    helm:
      releaseName: kube-prometheus-stack
      values: |
        global:
          imagePullSecrets:
            - name: regcred
        crds:
          enabled: false
          upgradeJob:
            image:
              kubectl:
                registry: k8s-mirror.liara.ir
        kube-state-metrics:
          image:
            registry: k8s-mirror.liara.ir
        prometheusOperator:
          image:
            registry: docker.io
            repository: delpak/godar-ai
            tag: mirror-prometheus-operator-v0.91.0
          prometheusConfigReloader:
            image:
              registry: docker.io
              repository: delpak/godar-ai
              tag: mirror-prometheus-config-reloader-v0.91.0
        prometheus-node-exporter:
          version: v1.11.1
          image:
            registry: docker.io
            repository: delpak/godar-ai
            tag: mirror-node-exporter-v1.11.1
        grafana:
          persistence:
            enabled: true
            storageClassName: observability-longhorn
            size: 5Gi
          sidecar:
            image:
              registry: docker.io
              repository: delpak/godar-ai
              tag: mirror-k8s-sidecar-2.7.3
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki-gateway.observability.svc.cluster.local
              isDefault: false
            - name: Tempo
              uid: tempo
              type: tempo
              access: proxy
              url: http://tempo.observability.svc.cluster.local:3200
              isDefault: false
              jsonData:
                httpMethod: GET
                tracesToLogsV2:
                  datasourceUid: loki
                  spanStartTimeShift: -5m
                  spanEndTimeShift: 5m
                  tags:
                    - key: service.name
                      value: service_name
                nodeGraph:
                  enabled: true
        alertmanager:
          alertmanagerSpec:
            image:
              registry: docker.io
              repository: prom/alertmanager
              tag: v0.32.2
            retention: 48h
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: observability-longhorn
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 2Gi
        prometheus:
          prometheusSpec:
            version: v3.12.0
            image:
              registry: docker.io
              repository: delpak/godar-ai
              tag: mirror-prometheus-v3.12.0-distroless
            retention: 7d
            retentionSize: 16GB
            serviceMonitorNamespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: In
                  values:
                    - observability
                    - ingress-nginx
                    - shahrah-production
                    - clickhouse-operator-system
            serviceMonitorSelector:
              matchLabels:
                release: kube-prometheus-stack
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: observability-longhorn
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 20Gi
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
