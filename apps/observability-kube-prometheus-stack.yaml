apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: observability
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 86.2.0
    helm:
      releaseName: kube-prometheus-stack
      values: |
        global:
          imagePullSecrets:
            - name: regcred
        crds:
          enabled: false
          upgradeJob:
            image:
              kubectl:
                registry: k8s-mirror.liara.ir
        kube-state-metrics:
          image:
            registry: k8s-mirror.liara.ir
        prometheusOperator:
          image:
            registry: docker.io
            repository: delpak/godar-ai
            tag: mirror-prometheus-operator-v0.91.0
          prometheusConfigReloader:
            image:
              registry: docker.io
              repository: delpak/godar-ai
              tag: mirror-prometheus-config-reloader-v0.91.0
        prometheus-node-exporter:
          version: v1.11.1
          image:
            registry: docker.io
            repository: delpak/godar-ai
            tag: mirror-node-exporter-v1.11.1
        grafana:
          enabled: false
        alertmanager:
          enabled: false
        prometheus:
          prometheusSpec:
            version: v3.12.0
            image:
              registry: docker.io
              repository: delpak/godar-ai
              tag: mirror-prometheus-v3.12.0-distroless
            retention: 2d
            retentionSize: 8GB
            resources:
              requests:
                cpu: 200m
                memory: 768Mi
              limits:
                cpu: "1"
                memory: 1536Mi
            serviceMonitorNamespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: In
                  values:
                    - observability
                    - ingress-nginx
                    - shahrah-production
                    - clickhouse-operator-system
            serviceMonitorSelector:
              matchLabels:
                release: kube-prometheus-stack
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: observability-longhorn
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 20Gi
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
