apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/part-of: observability
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 86.2.0
    helm:
      releaseName: kube-prometheus-stack
      values: |
        crds:
          enabled: false
          upgradeJob:
            image:
              kubectl:
                registry: k8s-mirror.liara.ir
        kube-state-metrics:
          image:
            registry: k8s-mirror.liara.ir
        grafana:
          persistence:
            enabled: true
            storageClassName: longhorn
            size: 10Gi
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki-gateway.observability.svc.cluster.local
              isDefault: false
            - name: Tempo
              uid: tempo
              type: tempo
              access: proxy
              url: http://tempo.observability.svc.cluster.local:3200
              isDefault: false
              jsonData:
                httpMethod: GET
                tracesToLogsV2:
                  datasourceUid: loki
                  spanStartTimeShift: -5m
                  spanEndTimeShift: 5m
                  tags:
                    - key: service.name
                      value: service_name
                nodeGraph:
                  enabled: true
        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 5Gi
        prometheus:
          prometheusSpec:
            retention: 15d
            serviceMonitorNamespaceSelector:
              matchNames:
                - observability
                - ingress-nginx
                - shahrah-production
            serviceMonitorSelector:
              matchLabels:
                release: kube-prometheus-stack
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 50Gi
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
