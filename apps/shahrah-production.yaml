apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shahrah-production
  namespace: argocd
  labels:
    app.kubernetes.io/name: shahrah
    app.kubernetes.io/part-of: shahrah
spec:
  project: shahrah
  source:
    repoURL: ssh://git@ssh.github.com:443/Delpak/shahrah-gitops.git
    targetRevision: main
    path: helm/shahrah
    helm:
      releaseName: shahrah
      valueFiles:
        - values.yaml
        - values.production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shahrah-production
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: control-plane
      namespace: shahrah-production
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: model-discovery
      namespace: shahrah-production
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: tenant-admin
      namespace: shahrah-production
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true



