apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-servicemonitor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: longhorn-servicemonitor
    app.kubernetes.io/part-of: observability
spec:
  project: default
  source:
    repoURL: ssh://git@ssh.github.com:443/godarai-ir/shahrah-gitops.git
    targetRevision: main
    path: platform/observability/longhorn-servicemonitor
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
