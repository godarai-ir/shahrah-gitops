apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-proxy-env
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-proxy-env
    app.kubernetes.io/part-of: platform
spec:
  project: default
  source:
    repoURL: ssh://git@ssh.github.com:443/godarai-ir/shahrah-gitops.git
    targetRevision: main
    path: platform/argocd-proxy-env
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
