apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-storageclasses
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: observability-storageclasses
    app.kubernetes.io/part-of: observability
spec:
  project: default
  source:
    repoURL: ssh://git@ssh.github.com:443/Delpak/shahrah-gitops.git
    targetRevision: main
    path: platform/observability/storageclasses
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
