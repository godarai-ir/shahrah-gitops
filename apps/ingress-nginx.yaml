apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: platform
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.13.3
    helm:
      releaseName: ingress-nginx
      values: |
        imagePullSecrets:
          - name: regcred
        controller:
          image:
            registry: registry.distr.sh
            image: godar/ingress-nginx/controller
            tag: v1.13.3
            digest: ""
          admissionWebhooks:
            patch:
              image:
                registry: registry.distr.sh
                image: godar/ingress-nginx/kube-webhook-certgen
                tag: v1.6.3
                digest: ""
          ingressClassResource:
            name: nginx
            enabled: true
            default: false
          ingressClass: nginx
          service:
            type: NodePort
            nodePorts:
              http: 30081
              https: 30444
          config:
            use-forwarded-headers: "true"
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
