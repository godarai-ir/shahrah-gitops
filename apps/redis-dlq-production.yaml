apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shahrah-redis-dlq
  namespace: argocd
  labels:
    app.kubernetes.io/name: shahrah-redis-dlq
    app.kubernetes.io/part-of: shahrah
spec:
  project: shahrah
  source:
    repoURL: ssh://git@ssh.github.com:443/Delpak/shahrah-gitops.git
    targetRevision: main
    path: vendor/redis
    helm:
      releaseName: shahrah-redis-dlq
      values: |
        architecture: replication
        image:
          registry: docker.io
          repository: bitnami/redis
          tag: latest
          digest: sha256:5ff436b8a0dbe3808f03c7b682865cd30ddb1f08c1a8d17970ebf475f5689722
        auth:
          enabled: true
          sentinel: true
          existingSecret: shahrah-redis-dlq
          existingSecretPasswordKey: redis-password
        commonConfiguration: |-
          appendonly yes
          appendfsync everysec
          save ""
          maxmemory 128mb
          maxmemory-policy noeviction
        master:
          persistence:
            enabled: true
            storageClass: longhorn-redis-r1
            size: 1Gi
          resources:
            requests:
              cpu: 25m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 320Mi
        replica:
          replicaCount: 3
          podAntiAffinityPreset: hard
          persistence:
            enabled: true
            storageClass: longhorn-redis-r1
            size: 1Gi
          persistentVolumeClaimRetentionPolicy:
            enabled: true
            whenScaled: Retain
            whenDeleted: Retain
          resources:
            requests:
              cpu: 25m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 320Mi
          pdb:
            create: true
            minAvailable: 2
        sentinel:
          enabled: true
          image:
            registry: docker.io
            repository: bitnami/redis-sentinel
            tag: latest
            digest: sha256:667bfef3e22ce9910bdcf304b1b7c659cfc15390a2d473187eb3caac2537d0e6
          masterSet: mymaster
          quorum: 2
          downAfterMilliseconds: 5000
          failoverTimeout: 60000
          parallelSyncs: 1
          automateClusterRecovery: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        networkPolicy:
          enabled: true
          allowExternal: false
          allowExternalEgress: false
          extraIngress:
            - from:
                - podSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/component
                        operator: In
                        values:
                          - control-plane
                          - metrics-dlq-replayer
          metrics:
            allowExternal: true
        metrics:
          enabled: true
          image:
            registry: docker.io
            repository: bitnami/redis-exporter
            tag: latest
            digest: sha256:0468a9a14ebd96953f967f9f3e8673c3eb1ad1dd54d379fef15c3f3ee714c99e
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          serviceMonitor:
            enabled: true
            namespace: shahrah-production
            interval: 30s
            additionalLabels:
              release: kube-prometheus-stack
            additionalEndpoints:
              - interval: 30s
                path: /scrape
                port: http-metrics
                params:
                  target:
                    - localhost:26379
                metricRelabelings:
                  - targetLabel: redis_role
                    replacement: sentinel
  destination:
    server: https://kubernetes.default.svc
    namespace: shahrah-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
