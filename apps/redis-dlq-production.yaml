apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shahrah-redis-dlq
  namespace: argocd
  labels:
    app.kubernetes.io/name: shahrah-redis-dlq
    app.kubernetes.io/part-of: shahrah
spec:
  project: shahrah
  source:
    repoURL: registry-1.docker.io/bitnamicharts
    chart: redis
    targetRevision: 23.1.1
    helm:
      releaseName: shahrah-redis-dlq
      values: |
        architecture: replication
        auth:
          enabled: true
          sentinel: true
          existingSecret: shahrah-redis-dlq
          existingSecretPasswordKey: redis-password
        commonConfiguration: |-
          appendonly yes
          appendfsync everysec
          save ""
          maxmemory 128mb
          maxmemory-policy noeviction
        master:
          persistence:
            enabled: true
            storageClass: longhorn-redis-r1
            size: 1Gi
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 320Mi
        replica:
          replicaCount: 3
          podAntiAffinityPreset: hard
          persistence:
            enabled: true
            storageClass: longhorn-redis-r1
            size: 1Gi
          persistentVolumeClaimRetentionPolicy:
            enabled: true
            whenScaled: Retain
            whenDeleted: Retain
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 320Mi
          pdb:
            create: true
            minAvailable: 2
        sentinel:
          enabled: true
          masterSet: mymaster
          quorum: 2
          downAfterMilliseconds: 5000
          failoverTimeout: 60000
          parallelSyncs: 1
          automateClusterRecovery: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        networkPolicy:
          enabled: true
          allowExternal: false
          allowExternalEgress: false
          extraIngress:
            - from:
                - podSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/component
                        operator: In
                        values:
                          - control-plane
                          - metrics-dlq-replayer
          metrics:
            allowExternal: true
        metrics:
          enabled: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          serviceMonitor:
            enabled: true
            namespace: shahrah-production
            interval: 30s
            additionalLabels:
              release: kube-prometheus-stack
            additionalEndpoints:
              - interval: 30s
                path: /scrape
                port: http-metrics
                params:
                  target:
                    - localhost:26379
                metricRelabelings:
                  - targetLabel: redis_role
                    replacement: sentinel
  destination:
    server: https://kubernetes.default.svc
    namespace: shahrah-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
