apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-arvan-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@godarai.ir
    privateKeySecretRef:
      name: letsencrypt-arvan-prod-account-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.arvancloud.ir
            solverName: arvancloud
            config:
              apiKeySecretRef:
                name: arvancloud-api-key
                key: apikey
              ttl: 120
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: godarai-ir-wildcard
  namespace: shahrah-production
spec:
  secretName: godarai-ir-tls
  issuerRef:
    name: letsencrypt-arvan-prod
    kind: ClusterIssuer
  dnsNames:
    - godarai.ir
    - "*.godarai.ir"
