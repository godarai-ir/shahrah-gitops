apiVersion: clickhouse.com/v1alpha1
kind: KeeperCluster
metadata:
  name: shahrah-keeper
  namespace: shahrah-production
  labels:
    app.kubernetes.io/name: clickhouse-keeper
    app.kubernetes.io/part-of: shahrah
    app.kubernetes.io/component: database-coordination
spec:
  replicas: 3
  dataVolumeClaimSpec:
    accessModes:
      - ReadWriteOnce
    storageClassName: longhorn-prod-r2
    resources:
      requests:
        storage: 2Gi
  podTemplate:
    nodeHostnameKey: kubernetes.io/hostname
    terminationGracePeriodSeconds: 30
  containerTemplate:
    image:
      repository: docker.io/clickhouse/clickhouse-keeper
      tag: 26.3.17.56
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  settings:
    logger:
      logToFile: false
      level: information
---
apiVersion: clickhouse.com/v1alpha1
kind: ClickHouseCluster
metadata:
  name: shahrah-clickhouse
  namespace: shahrah-production
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: shahrah
    app.kubernetes.io/component: database
spec:
  shards: 1
  # Single replica to save ~1 CPU / ~1Gi. Durability comes from the Longhorn
  # volume (patched to 2 replicas by hand; the storage class is r1) and the S3 backups.
  replicas: 1
  keeperClusterRef:
    name: shahrah-keeper
  dataVolumeClaimSpec:
    accessModes:
      - ReadWriteOnce
    storageClassName: longhorn-clickhouse-r1
    resources:
      requests:
        storage: 20Gi
  podTemplate:
    nodeHostnameKey: kubernetes.io/hostname
    terminationGracePeriodSeconds: 60
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - node-1
                    - node-2
  containerTemplate:
    image:
      repository: docker.io/clickhouse/clickhouse-server
      tag: 26.3.17.56
    imagePullPolicy: IfNotPresent
    # Replaces the operator's default /ping probe, which stays green on a replica
    # whose data volume was rebuilt but never rejoined sharah_db (UNKNOWN_DATABASE
    # for every query routed to it). Ready means: the server answers queries and
    # has at least as many sharah_db tables locally as the Replicated database
    # registers in Keeper.
    # If Keeper is unreachable or sharah_db is not registered yet (fresh install),
    # the probe passes. Failing it there would drain every replica at once and
    # deadlock the migrate-clickhouse hook, which reaches ClickHouse through the
    # Service.
    readinessProbe:
      exec:
        command:
          - sh
          - -c
          - |
            set -eu
            q() {
              clickhouse client --user sharah_user --password "$SHAHRAH_CLICKHOUSE_PASSWORD" \
                --connect_timeout 2 --receive_timeout 5 --query "$1"
            }
            local_tables=$(q "SELECT count() FROM system.tables WHERE database = 'sharah_db'")
            expected_tables=$(q "SELECT count() FROM system.zookeeper WHERE path = '/clickhouse/databases/sharah_db/metadata'" 2>/dev/null) || exit 0
            [ "$local_tables" -ge "$expected_tables" ]
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 8
      successThreshold: 1
      failureThreshold: 3
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    env:
      - name: SHAHRAH_CLICKHOUSE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: shahrah-secret
            key: CLICKHOUSE_PASSWORD
      - name: CLICKHOUSE_BACKUP_S3_ENDPOINT
        valueFrom:
          secretKeyRef:
            name: clickhouse-backup-s3
            key: endpoint
      - name: CLICKHOUSE_BACKUP_S3_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: clickhouse-backup-s3
            key: access-key
      - name: CLICKHOUSE_BACKUP_S3_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: clickhouse-backup-s3
            key: secret-key
      - name: CLICKHOUSE_BACKUP_S3_REGION
        valueFrom:
          secretKeyRef:
            name: clickhouse-backup-s3
            key: region
  externalSecret:
    name: shahrah-secret
    policy: Manage
  settings:
    logger:
      logToFile: false
      level: information
    extraConfig:
      storage_configuration:
        disks:
          backup_s3:
            type: s3_plain
            endpoint:
              "@from_env": CLICKHOUSE_BACKUP_S3_ENDPOINT
            access_key_id:
              "@from_env": CLICKHOUSE_BACKUP_S3_ACCESS_KEY
            secret_access_key:
              "@from_env": CLICKHOUSE_BACKUP_S3_SECRET_KEY
            region:
              "@from_env": CLICKHOUSE_BACKUP_S3_REGION
      backups:
        allowed_disk: backup_s3
        allow_concurrent_backups: false
        allow_concurrent_restores: false
    defaultUserPassword:
      secret:
        name: shahrah-secret
        key: CLICKHOUSE_PASSWORD
    extraUsersConfig:
      users:
        sharah_user:
          password:
            "@from_env": SHAHRAH_CLICKHOUSE_PASSWORD
            "@hide_in_preprocessed": true
          profile: default
          quota: default
          grants:
            - query: GRANT ALL ON *.*
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-ha
  namespace: shahrah-production
  labels:
    app.kubernetes.io/name: clickhouse-ha
    app.kubernetes.io/part-of: shahrah
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app: shahrah-clickhouse-clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: tcp
