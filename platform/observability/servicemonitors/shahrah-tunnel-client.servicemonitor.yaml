apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shahrah-tunnel-client
  namespace: shahrah-production
  labels:
    app.kubernetes.io/name: shahrah
    app.kubernetes.io/component: tunnel-client
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - shahrah-production
  selector:
    matchLabels:
      app.kubernetes.io/instance: shahrah
      app.kubernetes.io/component: tunnel-client
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
