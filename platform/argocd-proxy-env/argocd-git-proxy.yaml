apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-git-proxy
  namespace: argocd
data:
  socks5_to_http.py: |
    import select
    import socket
    import socketserver
    import struct

    UPSTREAM_HOST = "10.10.0.5"
    UPSTREAM_PORT = 3128
    LISTEN_PORT = 1080

    def recv_exact(sock, n):
        data = b""
        while len(data) < n:
            chunk = sock.recv(n - len(data))
            if not chunk:
                raise ConnectionError("unexpected eof")
            data += chunk
        return data

    class Handler(socketserver.BaseRequestHandler):
        def handle(self):
            client = self.request
            try:
                header = recv_exact(client, 2)
                if header[0] != 5:
                    return
                recv_exact(client, header[1])
                client.sendall(b"\x05\x00")
                ver, cmd, _, atyp = recv_exact(client, 4)
                if ver != 5 or cmd != 1:
                    client.sendall(b"\x05\x07\x00\x01\x00\x00\x00\x00\x00\x00")
                    return
                if atyp == 1:
                    host = socket.inet_ntoa(recv_exact(client, 4))
                elif atyp == 3:
                    host = recv_exact(client, recv_exact(client, 1)[0]).decode("idna")
                elif atyp == 4:
                    host = socket.inet_ntop(socket.AF_INET6, recv_exact(client, 16))
                else:
                    client.sendall(b"\x05\x08\x00\x01\x00\x00\x00\x00\x00\x00")
                    return
                port = struct.unpack("!H", recv_exact(client, 2))[0]
                upstream = socket.create_connection((UPSTREAM_HOST, UPSTREAM_PORT), timeout=20)
                upstream.sendall(
                    f"CONNECT {host}:{port} HTTP/1.1\r\n"
                    f"Host: {host}:{port}\r\n"
                    "Proxy-Connection: Keep-Alive\r\n\r\n"
                    .encode()
                )
                response = b""
                while b"\r\n\r\n" not in response:
                    chunk = upstream.recv(4096)
                    if not chunk:
                        raise ConnectionError("upstream closed")
                    response += chunk
                    if len(response) > 65536:
                        raise ConnectionError("upstream response too large")
                if not response.startswith((b"HTTP/1.1 200", b"HTTP/1.0 200")):
                    client.sendall(b"\x05\x05\x00\x01\x00\x00\x00\x00\x00\x00")
                    upstream.close()
                    return
                client.sendall(b"\x05\x00\x00\x01\x00\x00\x00\x00\x00\x00")
                sockets = [client, upstream]
                while True:
                    readable, _, _ = select.select(sockets, [], [], 300)
                    if not readable:
                        return
                    for s in readable:
                        data = s.recv(16384)
                        if not data:
                            return
                        (upstream if s is client else client).sendall(data)
            except Exception:
                return

    class Server(socketserver.ThreadingTCPServer):
        allow_reuse_address = True
        daemon_threads = True

    if __name__ == "__main__":
        with Server(("0.0.0.0", LISTEN_PORT), Handler) as server:
            server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-git-proxy
  namespace: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-git-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-git-proxy
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: proxy
          image: docker.io/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/socks5_to_http.py
          ports:
            - containerPort: 1080
              name: socks5
          readinessProbe:
            tcpSocket:
              port: socks5
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: socks5
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: argocd-git-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-git-proxy
  namespace: argocd
spec:
  selector:
    app.kubernetes.io/name: argocd-git-proxy
  ports:
    - name: socks5
      port: 1080
      targetPort: socks5
