apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shahrah
  namespace: argocd
spec:
  description: Shahrah GitOps project with environment guardrails.
  sourceRepos:
    - https://github.com/godarai-ir/shahrah-gitops.git
    - git@github.com:godarai-ir/shahrah-gitops.git
    - ssh://git@ssh.github.com:443/godarai-ir/shahrah-gitops.git
    - registry-1.docker.io/bitnamicharts
  destinations:
    - namespace: shahrah-staging
      server: https://kubernetes.default.svc
    - namespace: shahrah-production
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
